<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cockpit</title>
<meta name="theme-color" content="#0A0E14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cockpit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
@font-face { font-family: 'Archivo'; font-style: normal; font-display: swap; font-weight: 100 900; font-stretch: 62% 125%;
  src: url(fonts/archivo-latin-wdth-normal.woff2) format('woff2-variations');
  unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
@font-face { font-family: 'Archivo'; font-style: normal; font-display: swap; font-weight: 100 900; font-stretch: 62% 125%;
  src: url(fonts/archivo-latin-ext-wdth-normal.woff2) format('woff2-variations');
  unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }

:root{
  --ink:#0A0E14; --panel:#131A24; --panel2:#1B2430; --line:#242F3D; --line2:#1A222D;
  --text:#E8EDF2; --dim:#8D9AAA; --faint:#5C6B7C;
  --accent:#5BC8F5; --accent-ink:#06202E;
  --good:#4ED6A8; --mid:#F0B65E; --low:#F2706E; --deep:#6E8CFF;
  --r-s:12px; --r-m:18px; --r-l:26px;
  --gut:20px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05080C;color:var(--text);
  font-family:'Archivo',ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.5;font-stretch:100%;-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;text-rendering:optimizeLegibility}
body{display:flex;justify-content:center}
#app{position:relative;width:100%;max-width:468px;height:100vh;height:100dvh;background:var(--ink);display:flex;flex-direction:column;overflow:hidden}
@media(min-width:640px){body{align-items:center;padding:20px 0}
  #app{height:min(960px,calc(100vh - 40px));border-radius:34px;box-shadow:0 0 0 1px #1A2430,0 30px 80px rgba(0,0,0,.6)}}
#view{flex:1;overflow-y:auto;overscroll-behavior-y:contain;padding:0 var(--gut) 40px;scroll-behavior:smooth}
#view::-webkit-scrollbar{width:0}

/* ---------- typographie ---------- */
h1{font-size:30px;font-stretch:104%;font-weight:680;letter-spacing:-.018em;margin:0;line-height:1.08}
h2{font-size:21px;font-stretch:102%;font-weight:650;letter-spacing:-.012em;margin:0 0 2px}
h3{font-size:16px;font-weight:620;margin:0}
p{margin:0 0 10px}
.lede{color:var(--dim);font-size:14.5px}
.meta{color:var(--faint);font-size:12.5px;font-stretch:92%;letter-spacing:.012em}
.dim{color:var(--dim)}.faint{color:var(--faint)}
.num{font-stretch:116%;font-weight:620;letter-spacing:-.02em;font-feature-settings:"tnum" 1}
.warnTx{color:var(--mid)}.badTx{color:var(--low)}.goodTx{color:var(--good)}.acc{color:var(--accent)}
.danger{color:var(--low) !important}
a{color:var(--accent);cursor:pointer;text-decoration:none}
.small{font-size:13.5px}.tiny{font-size:12px;line-height:1.45}

/* ---------- structure ---------- */
.screenTop{padding:max(16px,calc(env(safe-area-inset-top) + 10px)) 0 6px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.band{margin:30px 0 12px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.band h3{font-size:17px;font-weight:640;letter-spacing:-.008em}
.band .meta{flex:none}
.rule{height:1px;background:var(--line2);margin:22px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row.top{align-items:flex-start}
.grow{flex:1;min-width:0}
.wrap{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* ---------- cartes ---------- */
.card{background:var(--panel);border-radius:var(--r-m);padding:16px;margin:10px 0}
.card.flat{background:none;border:1px solid var(--line);}
.card.quiet{background:var(--panel);padding:14px 16px}
.note{color:var(--dim);font-size:13px;margin:10px 2px 0;line-height:1.5}
.note.tight{margin-top:6px}

/* ---------- jauge de récupération ---------- */
.gauge{position:relative;display:flex;flex-direction:column;align-items:center;padding:6px 0 2px}
.gauge svg{width:100%;max-width:300px;height:auto;overflow:visible}
.gaugeMid{position:absolute;top:46%;left:0;right:0;text-align:center;transform:translateY(-50%);pointer-events:none}
.gaugeVal{font-size:62px;font-stretch:112%;font-weight:600;letter-spacing:-.04em;line-height:1}
.gaugeUnit{font-size:22px;font-stretch:100%;font-weight:500;color:var(--dim);margin-left:2px}
.gaugeCap{font-size:14px;color:var(--dim);margin-top:6px}
.gaugeState{font-size:19px;font-weight:620;letter-spacing:-.01em;margin-top:-2px}
.legs{display:flex;justify-content:center;gap:16px;margin-top:10px;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim)}
.leg i{width:9px;height:9px;border-radius:50%;background:var(--c, var(--faint));display:block}
.leg i.off{background:none;box-shadow:inset 0 0 0 1.5px var(--faint)}

/* ---------- lignes de mesure ---------- */
.metrics{display:flex;flex-direction:column;gap:2px}
.metric{display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px;padding:13px 16px;background:var(--panel);cursor:pointer}
.metric:first-child{border-radius:var(--r-m) var(--r-m) 0 0}
.metric:last-child{border-radius:0 0 var(--r-m) var(--r-m)}
.metric:only-child{border-radius:var(--r-m)}
.metric:active{background:var(--panel2)}
.metricName{font-weight:560}
.metricVal{font-size:25px;font-stretch:114%;font-weight:620;letter-spacing:-.02em;text-align:right;line-height:1.1}
.metricVal small{font-size:13px;font-stretch:100%;font-weight:500;color:var(--dim);margin-left:3px}
.spark{display:block;height:26px;width:90px}
.state{font-size:12.5px;color:var(--dim)}
.state b{font-weight:600}

/* ---------- pastilles ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-stretch:94%;padding:3px 9px;border-radius:999px;
  color:var(--c,var(--dim));background:color-mix(in srgb,var(--c,var(--faint)) 15%,transparent);white-space:nowrap}
.pill.line{background:none;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c,var(--faint)) 40%,transparent)}

/* ---------- séances ---------- */
.sess{display:flex;gap:0;background:var(--panel);border-radius:var(--r-m);margin:10px 0;overflow:hidden;cursor:pointer}
.sess:active{background:var(--panel2)}
.sessRail{width:4px;flex:none;background:var(--c,var(--accent))}
.sessBody{padding:14px 16px;flex:1;min-width:0}
.sessWhen{font-size:12px;color:var(--faint);font-stretch:92%}
.sessTitle{font-weight:620;font-size:16.5px;letter-spacing:-.008em;margin:1px 0 3px;display:flex;align-items:center;gap:8px}
.sessTitle .ic{color:var(--c,var(--accent));flex:none;display:flex}
.sessWhat{color:var(--dim);font-size:13.5px}
.sessCond{color:var(--mid);font-size:12.5px;margin-top:4px}
.sessActs{display:flex;gap:8px;margin:-4px 0 14px;padding-left:4px}

/* ---------- boutons ---------- */
.btn{appearance:none;background:var(--panel2);color:var(--text);border:0;border-radius:var(--r-s);padding:11px 16px;
  font:inherit;font-size:14.5px;font-weight:560;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:active{transform:scale(.985)}
.btn.pri{background:var(--accent);color:var(--accent-ink);font-weight:650}
.btn.ghost{background:none;box-shadow:inset 0 0 0 1px var(--line)}
.btn.full{width:100%;margin:8px 0 0}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.lg{padding:16px;font-size:16.5px;border-radius:14px;width:100%}
.btn:disabled{opacity:.45}
.link{background:none;border:0;color:var(--accent);font:inherit;font-size:14.5px;cursor:pointer;padding:6px 2px}
.link.quiet{color:var(--dim)}
.iconBtn{width:38px;height:38px;border-radius:50%;background:var(--panel);border:0;color:var(--dim);display:grid;place-items:center;cursor:pointer;flex:none}
.iconBtn:active{background:var(--panel2)}

/* ---------- listes ---------- */
.list{background:var(--panel);border-radius:var(--r-m);overflow:hidden;margin:10px 0}
.li{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;border-bottom:1px solid var(--line2)}
.li:last-child{border-bottom:0}
.li:active{background:var(--panel2)}
.li .grow{font-size:14.5px}
.li .chev{color:var(--faint);flex:none;display:flex}
.li.plain{cursor:default}
.li.plain:active{background:none}
.li .ic{color:var(--dim);flex:none;display:flex}

/* ---------- graphiques ---------- */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .ax{fill:var(--faint);font-size:10.5px;font-stretch:92%}
.chart .grid{stroke:var(--line2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--dim)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;background:var(--c);display:block}
.hyp{display:flex;height:34px;border-radius:7px;overflow:hidden;gap:1px;margin:10px 0 4px}
.hyp i{display:block;height:100%}
.bars{display:flex;align-items:flex-end;gap:3px;height:64px;margin:12px 0 4px}
.bars i{flex:1;border-radius:3px 3px 0 0;background:var(--c,var(--line));min-height:2px;display:block}
.barLabels{display:flex;justify-content:space-between;font-size:11px;color:var(--faint)}

/* ---------- barre de progression / charge ---------- */
.meter{height:7px;border-radius:4px;background:var(--line2);overflow:hidden;margin:9px 0}
.meter i{display:block;height:100%;background:var(--c,var(--accent));border-radius:4px}
.scaleBar{position:relative;height:30px;margin:14px 0 6px}
.scaleBar .zone{position:absolute;top:11px;height:8px;border-radius:4px}
.scaleBar .mark{position:absolute;top:3px;width:3px;height:24px;border-radius:2px;background:var(--text)}
.scaleTicks{display:flex;justify-content:space-between;font-size:11px;color:var(--faint)}

/* ---------- formulaires ---------- */
.field{margin:14px 0}
.field label{display:block;font-size:13px;color:var(--dim);margin-bottom:6px}
input,select,textarea{width:100%;background:var(--panel2);color:var(--text);border:1px solid transparent;border-radius:var(--r-s);
  padding:12px 13px;font:inherit;font-size:15px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,.li:focus-visible,.sess:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea{min-height:76px;resize:vertical}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
input[type=range]{padding:0;accent-color:var(--accent);background:none;border:0}
.seg{display:flex;gap:4px}
.seg button{flex:1;padding:11px 0;background:var(--panel2);color:var(--dim);border:0;border-radius:10px;font:inherit;font-size:14px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:650}
.chips{display:flex;flex-wrap:wrap;gap:8px 14px}
.chips label{display:flex;align-items:center;gap:6px;font-size:13.5px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:14px}
.kv:last-child{border-bottom:0}
.kv>span{color:var(--dim)}
.kv>b{font-weight:580;text-align:right}
.switchRow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}

/* ---------- échelle 1-7 ---------- */
.ladder{display:flex;gap:5px;margin:8px 0 4px}
.ladder button{flex:1;height:46px;border:0;border-radius:10px;background:var(--panel2);color:var(--dim);font:inherit;font-size:14px;cursor:pointer}
.ladder button.on{background:var(--accent);color:var(--accent-ink);font-weight:650}
.ladderEnds{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint)}

/* ---------- barre d'onglets ---------- */
.tabbar{display:flex;background:rgba(10,14,20,.86);backdrop-filter:blur(18px);border-top:1px solid var(--line2);
  padding:7px 4px calc(7px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;background:none;border:0;color:var(--faint);font:inherit;font-size:10.5px;font-stretch:92%;
  padding:4px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar button svg{opacity:.75}
.tabbar button.on{color:var(--accent)}
.tabbar button.on svg{opacity:1}

/* ---------- feuilles ---------- */
#sheet,#workout,#login{position:absolute;inset:0;z-index:20;display:none}
#sheet.on,#workout.on,#login.on{display:flex}
#sheet{background:rgba(3,6,10,.6);align-items:flex-end}
#workout{z-index:30}
.sheetBox{background:var(--ink);width:100%;height:94%;border-radius:26px 26px 0 0;display:flex;flex-direction:column;animation:rise .22s cubic-bezier(.3,.9,.3,1)}
#workout .sheetBox{height:100%;border-radius:0}
@keyframes rise{from{transform:translateY(26px)}}
.sheetHead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:12px 12px 10px;border-bottom:1px solid var(--line2)}
.sheetHead b{text-align:center;font-weight:620;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheetHead>:first-child{justify-self:start}.sheetHead>:last-child{justify-self:end}
.sheetBody{flex:1;overflow-y:auto;padding:4px var(--gut) 44px}
.sheetBody::-webkit-scrollbar{width:0}

/* ---------- lecteur de séance ---------- */
.woTop{padding:14px var(--gut) 0}
.woProg{display:flex;gap:3px;margin:12px 0 4px}
.woProg i{flex:1;height:3px;border-radius:2px;background:var(--line);display:block}
.woProg i.done{background:var(--accent)}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:16px 0}
.stepper button{width:62px;height:62px;border-radius:50%;background:var(--panel2);border:0;color:var(--text);font-size:28px;font-weight:300;cursor:pointer}
.stepper button:active{background:var(--line)}
.stepVal{text-align:center;flex:1}
.stepVal b{display:block;font-size:34px;font-stretch:112%;font-weight:620;letter-spacing:-.03em;line-height:1.1}
.stepVal span{font-size:12.5px;color:var(--faint)}
.rest{text-align:center;padding:7vh 0 10px}
.restNum{font-size:78px;font-stretch:108%;font-weight:300;letter-spacing:-.04em;line-height:1}
.target{display:flex;gap:26px;margin:12px 0;flex-wrap:wrap}
.target div small{display:block;font-size:11.5px;color:var(--faint)}
.target div b{font-size:19px;font-stretch:108%;font-weight:620}

/* ---------- connexion ---------- */
#login{background:var(--ink);align-items:center;justify-content:center;padding:26px}
.loginBox{width:100%;max-width:330px;text-align:center}
.loginBox h1{font-size:34px;margin-bottom:4px}
.loginBox form{text-align:left;margin:26px 0 4px}
.mark{width:54px;height:54px;margin-bottom:14px}

/* ---------- divers ---------- */
#toast{position:absolute;left:50%;bottom:86px;transform:translateX(-50%) translateY(14px);background:var(--panel2);
  border:1px solid var(--line);padding:11px 18px;border-radius:14px;font-size:13.5px;opacity:0;transition:.22s;pointer-events:none;z-index:40;max-width:88%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
#simbar{display:none;background:#33260E;color:var(--mid);font-size:12.5px;padding:7px var(--gut);text-align:center}
#simbar a{text-decoration:underline}
.sync{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--faint);cursor:pointer}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.dot[data-st=ok]{background:var(--good)}.dot[data-st=sync],.dot[data-st=pending]{background:var(--accent)}
.dot[data-st=offline]{background:var(--mid)}
details summary{cursor:pointer;color:var(--dim);font-size:13px;padding:6px 0;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:'+ ';color:var(--faint)}
details[open] summary::before{content:'– '}
.empty{color:var(--dim);font-size:14px;padding:18px 2px;line-height:1.55}
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 calc(-1 * var(--gut));padding:2px var(--gut) 6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{height:0}
.ev{flex:none;width:150px;background:var(--panel);border-radius:var(--r-m);padding:13px 14px;cursor:pointer}
.evDays{font-size:27px;font-stretch:112%;font-weight:620;letter-spacing:-.02em;line-height:1}
.exrow{padding:11px 0;border-bottom:1px solid var(--line2)}
.exrow:last-child{border-bottom:0}
.pre{white-space:pre-wrap}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

/* ---------- schémas de mouvement ---------- */
.mv{--mv-body:var(--text);--mv-load:var(--mid);--mv-line:var(--line);width:100%;height:auto;display:block}
.mvBox{background:var(--panel2);border-radius:var(--r-m);padding:6px;aspect-ratio:1;display:grid;place-items:center}
.mvBox.sm{width:76px;height:76px;padding:2px;flex:none;aspect-ratio:auto}
.mvRow{display:flex;gap:14px;align-items:center}

/* ---------- coach ---------- */
.verdict{border-radius:var(--r-l);padding:18px;margin:14px 0 10px;background:
  linear-gradient(180deg,color-mix(in srgb,var(--c) 17%,var(--panel)),var(--panel))}
.verdictTop{display:flex;gap:12px;align-items:flex-start}
.verdictTop .ic{color:var(--c);flex:none;display:flex;margin-top:1px}
.verdict h2{letter-spacing:-.016em}
.sig{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line2)}
.sig:last-child{border-bottom:0}
.sig i{width:7px;height:7px;border-radius:50%;margin-top:7px;flex:none;background:var(--c)}
.prop{background:var(--panel2);border-radius:var(--r-s);padding:12px 14px;margin:8px 0;display:flex;gap:12px;align-items:center}
.prop .grow{font-size:13.5px}

/* ---------- tableaux de données ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:right;font-weight:500;color:var(--faint);font-size:11.5px;padding:0 0 6px}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{text-align:right;padding:7px 0;border-top:1px solid var(--line2);font-variant-numeric:tabular-nums}
.tbl td.bar{width:38%;padding-left:10px}
.tbl i{display:block;height:7px;border-radius:4px;background:var(--c,var(--accent))}
.zrow{display:flex;align-items:center;gap:10px;padding:5px 0}
.zrow .zl{width:92px;font-size:12.5px;color:var(--dim);flex:none}
.zrow .zb{flex:1;height:9px;border-radius:5px;background:var(--line2);overflow:hidden}
.zrow .zb i{display:block;height:100%;background:var(--c)}
.zrow .zv{width:52px;text-align:right;font-size:12.5px;flex:none}
.pr{display:flex;gap:10px;overflow-x:auto;margin:0 calc(-1*var(--gut));padding:2px var(--gut) 8px;scrollbar-width:none}
.pr::-webkit-scrollbar{height:0}
.prCard{flex:none;min-width:104px;background:var(--panel);border-radius:var(--r-m);padding:12px 14px}
.prCard b{display:block;font-size:19px;font-stretch:112%;font-weight:620;letter-spacing:-.02em}

/* ---------- classes héritées des fenêtres de détail, redessinées ---------- */
.t2{color:var(--dim)}.t3{color:var(--faint)}.b{font-weight:620}.warn{color:var(--mid)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 8px;font-size:16.5px;font-weight:640;letter-spacing:-.008em}
.sec small{font-size:12.5px;font-weight:400;color:var(--faint)}
.badge{display:inline-flex;align-items:center;font-size:12px;font-stretch:94%;padding:3px 9px;border-radius:999px;color:var(--c,var(--dim));background:color-mix(in srgb,var(--c,var(--faint)) 15%,transparent);white-space:nowrap}
.srow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:5px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid2>.card,.grid2>.tile,.grid3>.card{margin:0}
.tile{background:var(--panel);border-radius:var(--r-m);padding:14px 15px}
.tile .tt{font-size:12.5px;color:var(--dim)}
.tile .tv{font-size:27px;font-stretch:114%;font-weight:620;letter-spacing:-.02em;margin:3px 0 1px}
.tile .tv small{font-size:13px;font-stretch:100%;font-weight:500;color:var(--dim);margin-left:3px}
.tile .td{font-size:12.5px;color:var(--dim)}.tile .tp{font-size:11px;color:var(--faint);margin-top:5px}
.card.hint{color:var(--dim);font-size:14px}
.card.demo{border:1px dashed color-mix(in srgb,var(--accent) 45%,transparent);display:flex;flex-direction:column;gap:10px}
.click{cursor:pointer}.click:active{background:var(--panel2)}
.dim{color:var(--faint)}.pad{padding:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:-2px 0 14px}
.scard{display:flex;gap:13px;cursor:pointer}
.sicon{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent)}
.sbody{flex:1;min-width:0}.slot{font-size:12px;color:var(--faint)}
.stitle{font-weight:620;font-size:16px}.ssub{font-size:13.5px;color:var(--dim)}.scond{font-size:12.5px;color:var(--mid)}
.obs .oi{font-size:17px;width:20px;flex:none}
.prio{width:32px;height:32px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;font-weight:650;font-size:13px;color:var(--dim);flex:none}
.prio.a{background:var(--mid);color:#241502}
.scale{display:flex;gap:5px;margin:8px 0 4px}
.scale button{flex:1;height:46px;border:0;border-radius:10px;background:var(--panel2);color:var(--dim);font:inherit;font-size:14px;cursor:pointer}
.scale button.on{background:var(--accent);color:var(--accent-ink);font-weight:650}
.search{margin:6px 0 10px}
.big{font-size:23px;font-stretch:110%;font-weight:620;letter-spacing:-.02em}
.pbar{height:5px;background:var(--line2);border-radius:3px;overflow:hidden;margin:10px 0}
.pbar i{display:block;height:100%;background:var(--accent)}
.zbar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:7px 0}
.center{text-align:center;padding:54px 0}
.huge{font-size:76px;font-stretch:108%;font-weight:300;letter-spacing:-.04em;line-height:1;margin:6px 0}
.restp{text-align:center}.restp .grid2{margin:12px 0}
.targets{display:flex;gap:26px;margin:10px 0}
.targets small{display:block;font-size:11.5px;color:var(--faint)}.targets b{font-size:19px;font-stretch:108%}
.bigbtn{padding:16px;font-size:16.5px;border-radius:14px}
.up{text-transform:none;letter-spacing:.01em}
.list .li>span:last-child{color:var(--faint)}
.li.dim{cursor:default;color:var(--faint)}
.evmini{min-width:142px;flex:none;cursor:pointer;margin:0}
