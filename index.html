<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cockpit</title>
<meta name="theme-color" content="#0A0E14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cockpit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
@font-face { font-family: 'Archivo'; font-style: normal; font-display: swap; font-weight: 100 900; font-stretch: 62% 125%;
  src: url(fonts/archivo-latin-wdth-normal.woff2) format('woff2-variations');
  unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
@font-face { font-family: 'Archivo'; font-style: normal; font-display: swap; font-weight: 100 900; font-stretch: 62% 125%;
  src: url(fonts/archivo-latin-ext-wdth-normal.woff2) format('woff2-variations');
  unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }

:root{
  --ink:#0A0E14; --panel:#131A24; --panel2:#1B2430; --line:#242F3D; --line2:#1A222D;
  --text:#E8EDF2; --dim:#8D9AAA; --faint:#5C6B7C;
  --accent:#5BC8F5; --accent-ink:#06202E;
  --good:#4ED6A8; --mid:#F0B65E; --low:#F2706E; --deep:#6E8CFF;
  --r-s:12px; --r-m:18px; --r-l:26px;
  --gut:20px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05080C;color:var(--text);
  font-family:'Archivo',ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.5;font-stretch:100%;-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;text-rendering:optimizeLegibility}
body{display:flex;justify-content:center}
#app{position:relative;width:100%;max-width:468px;height:100vh;height:100dvh;background:var(--ink);display:flex;flex-direction:column;overflow:hidden}
@media(min-width:640px){body{align-items:center;padding:20px 0}
  #app{height:min(960px,calc(100vh - 40px));border-radius:34px;box-shadow:0 0 0 1px #1A2430,0 30px 80px rgba(0,0,0,.6)}}
#view{flex:1;overflow-y:auto;overscroll-behavior-y:contain;padding:0 var(--gut) 40px;scroll-behavior:smooth}
#view::-webkit-scrollbar{width:0}

/* ---------- typographie ---------- */
h1{font-size:30px;font-stretch:104%;font-weight:680;letter-spacing:-.018em;margin:0;line-height:1.08}
h2{font-size:21px;font-stretch:102%;font-weight:650;letter-spacing:-.012em;margin:0 0 2px}
h3{font-size:16px;font-weight:620;margin:0}
p{margin:0 0 10px}
.lede{color:var(--dim);font-size:14.5px}
.meta{color:var(--faint);font-size:12.5px;font-stretch:92%;letter-spacing:.012em}
.dim{color:var(--dim)}.faint{color:var(--faint)}
.num{font-stretch:116%;font-weight:620;letter-spacing:-.02em;font-feature-settings:"tnum" 1}
.warnTx{color:var(--mid)}.badTx{color:var(--low)}.goodTx{color:var(--good)}.acc{color:var(--accent)}
.danger{color:var(--low) !important}
a{color:var(--accent);cursor:pointer;text-decoration:none}
.small{font-size:13.5px}.tiny{font-size:12px;line-height:1.45}

/* ---------- structure ---------- */
.screenTop{padding:max(16px,calc(env(safe-area-inset-top) + 10px)) 0 6px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.band{margin:30px 0 12px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.band h3{font-size:17px;font-weight:640;letter-spacing:-.008em}
.band .meta{flex:none}
.rule{height:1px;background:var(--line2);margin:22px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row.top{align-items:flex-start}
.grow{flex:1;min-width:0}
.wrap{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* ---------- cartes ---------- */
.card{background:var(--panel);border-radius:var(--r-m);padding:16px;margin:10px 0}
.card.flat{background:none;border:1px solid var(--line);}
.card.quiet{background:var(--panel);padding:14px 16px}
.note{color:var(--dim);font-size:13px;margin:10px 2px 0;line-height:1.5}
.note.tight{margin-top:6px}

/* ---------- jauge de récupération ---------- */
.gauge{position:relative;display:flex;flex-direction:column;align-items:center;padding:6px 0 2px}
.gauge svg{width:100%;max-width:300px;height:auto;overflow:visible}
.gaugeMid{position:absolute;top:46%;left:0;right:0;text-align:center;transform:translateY(-50%);pointer-events:none}
.gaugeVal{font-size:62px;font-stretch:112%;font-weight:600;letter-spacing:-.04em;line-height:1}
.gaugeUnit{font-size:22px;font-stretch:100%;font-weight:500;color:var(--dim);margin-left:2px}
.gaugeCap{font-size:14px;color:var(--dim);margin-top:6px}
.gaugeState{font-size:19px;font-weight:620;letter-spacing:-.01em;margin-top:-2px}
.legs{display:flex;justify-content:center;gap:16px;margin-top:10px;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim)}
.leg i{width:9px;height:9px;border-radius:50%;background:var(--c, var(--faint));display:block}
.leg i.off{background:none;box-shadow:inset 0 0 0 1.5px var(--faint)}

/* ---------- lignes de mesure ---------- */
.metrics{display:flex;flex-direction:column;gap:2px}
.metric{display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px;padding:13px 16px;background:var(--panel);cursor:pointer}
.metric:first-child{border-radius:var(--r-m) var(--r-m) 0 0}
.metric:last-child{border-radius:0 0 var(--r-m) var(--r-m)}
.metric:only-child{border-radius:var(--r-m)}
.metric:active{background:var(--panel2)}
.metricName{font-weight:560}
.metricVal{font-size:25px;font-stretch:114%;font-weight:620;letter-spacing:-.02em;text-align:right;line-height:1.1}
.metricVal small{font-size:13px;font-stretch:100%;font-weight:500;color:var(--dim);margin-left:3px}
.spark{display:block;height:26px;width:90px}
.state{font-size:12.5px;color:var(--dim)}
.state b{font-weight:600}

/* ---------- pastilles ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-stretch:94%;padding:3px 9px;border-radius:999px;
  color:var(--c,var(--dim));background:color-mix(in srgb,var(--c,var(--faint)) 15%,transparent);white-space:nowrap}
.pill.line{background:none;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c,var(--faint)) 40%,transparent)}

/* ---------- séances ---------- */
.sess{display:flex;gap:0;background:var(--panel);border-radius:var(--r-m);margin:10px 0;overflow:hidden;cursor:pointer}
.sess:active{background:var(--panel2)}
.sessRail{width:4px;flex:none;background:var(--c,var(--accent))}
.sessBody{padding:14px 16px;flex:1;min-width:0}
.sessWhen{font-size:12px;color:var(--faint);font-stretch:92%}
.sessTitle{font-weight:620;font-size:16.5px;letter-spacing:-.008em;margin:1px 0 3px;display:flex;align-items:center;gap:8px}
.sessTitle .ic{color:var(--c,var(--accent));flex:none;display:flex}
.sessWhat{color:var(--dim);font-size:13.5px}
.sessCond{color:var(--mid);font-size:12.5px;margin-top:4px}
.sessActs{display:flex;gap:8px;margin:-4px 0 14px;padding-left:4px}

/* ---------- boutons ---------- */
.btn{appearance:none;background:var(--panel2);color:var(--text);border:0;border-radius:var(--r-s);padding:11px 16px;
  font:inherit;font-size:14.5px;font-weight:560;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:active{transform:scale(.985)}
.btn.pri{background:var(--accent);color:var(--accent-ink);font-weight:650}
.btn.ghost{background:none;box-shadow:inset 0 0 0 1px var(--line)}
.btn.full{width:100%;margin:8px 0 0}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.lg{padding:16px;font-size:16.5px;border-radius:14px;width:100%}
.btn:disabled{opacity:.45}
.link{background:none;border:0;color:var(--accent);font:inherit;font-size:14.5px;cursor:pointer;padding:6px 2px}
.link.quiet{color:var(--dim)}
.iconBtn{width:38px;height:38px;border-radius:50%;background:var(--panel);border:0;color:var(--dim);display:grid;place-items:center;cursor:pointer;flex:none}
.iconBtn:active{background:var(--panel2)}

/* ---------- listes ---------- */
.list{background:var(--panel);border-radius:var(--r-m);overflow:hidden;margin:10px 0}
.li{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;border-bottom:1px solid var(--line2)}
.li:last-child{border-bottom:0}
.li:active{background:var(--panel2)}
.li .grow{font-size:14.5px}
.li .chev{color:var(--faint);flex:none;display:flex}
.li.plain{cursor:default}
.li.plain:active{background:none}
.li .ic{color:var(--dim);flex:none;display:flex}

/* ---------- graphiques ---------- */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .ax{fill:var(--faint);font-size:10.5px;font-stretch:92%}
.chart .grid{stroke:var(--line2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--dim)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;background:var(--c);display:block}
.hyp{display:flex;height:34px;border-radius:7px;overflow:hidden;gap:1px;margin:10px 0 4px}
.hyp i{display:block;height:100%}
.bars{display:flex;align-items:flex-end;gap:3px;height:64px;margin:12px 0 4px}
.bars i{flex:1;border-radius:3px 3px 0 0;background:var(--c,var(--line));min-height:2px;display:block}
.barLabels{display:flex;justify-content:space-between;font-size:11px;color:var(--faint)}

/* ---------- barre de progression / charge ---------- */
.meter{height:7px;border-radius:4px;background:var(--line2);overflow:hidden;margin:9px 0}
.meter i{display:block;height:100%;background:var(--c,var(--accent));border-radius:4px}
.scaleBar{position:relative;height:30px;margin:14px 0 6px}
.scaleBar .zone{position:absolute;top:11px;height:8px;border-radius:4px}
.scaleBar .mark{position:absolute;top:3px;width:3px;height:24px;border-radius:2px;background:var(--text)}
.scaleTicks{display:flex;justify-content:space-between;font-size:11px;color:var(--faint)}

/* ---------- formulaires ---------- */
.field{margin:14px 0}
.field label{display:block;font-size:13px;color:var(--dim);margin-bottom:6px}
input,select,textarea{width:100%;background:var(--panel2);color:var(--text);border:1px solid transparent;border-radius:var(--r-s);
  padding:12px 13px;font:inherit;font-size:15px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,.li:focus-visible,.sess:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea{min-height:76px;resize:vertical}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
input[type=range]{padding:0;accent-color:var(--accent);background:none;border:0}
.seg{display:flex;gap:4px}
.seg button{flex:1;padding:11px 0;background:var(--panel2);color:var(--dim);border:0;border-radius:10px;font:inherit;font-size:14px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:650}
.chips{display:flex;flex-wrap:wrap;gap:8px 14px}
.chips label{display:flex;align-items:center;gap:6px;font-size:13.5px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:14px}
.kv:last-child{border-bottom:0}
.kv>span{color:var(--dim)}
.kv>b{font-weight:580;text-align:right}
.switchRow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}

/* ---------- échelle 1-7 ---------- */
.ladder{display:flex;gap:5px;margin:8px 0 4px}
.ladder button{flex:1;height:46px;border:0;border-radius:10px;background:var(--panel2);color:var(--dim);font:inherit;font-size:14px;cursor:pointer}
.ladder button.on{background:var(--accent);color:var(--accent-ink);font-weight:650}
.ladderEnds{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint)}

/* ---------- barre d'onglets ---------- */
.tabbar{display:flex;background:rgba(10,14,20,.86);backdrop-filter:blur(18px);border-top:1px solid var(--line2);
  padding:7px 4px calc(7px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;background:none;border:0;color:var(--faint);font:inherit;font-size:10.5px;font-stretch:92%;
  padding:4px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar button svg{opacity:.75}
.tabbar button.on{color:var(--accent)}
.tabbar button.on svg{opacity:1}

/* ---------- feuilles ---------- */
#sheet,#workout,#login{position:absolute;inset:0;z-index:20;display:none}
#sheet.on,#workout.on,#login.on{display:flex}
#sheet{background:rgba(3,6,10,.6);align-items:flex-end}
#workout{z-index:30}
.sheetBox{background:var(--ink);width:100%;height:94%;border-radius:26px 26px 0 0;display:flex;flex-direction:column;animation:rise .22s cubic-bezier(.3,.9,.3,1)}
#workout .sheetBox{height:100%;border-radius:0}
@keyframes rise{from{transform:translateY(26px)}}
.sheetHead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:12px 12px 10px;border-bottom:1px solid var(--line2)}
.sheetHead b{text-align:center;font-weight:620;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheetHead>:first-child{justify-self:start}.sheetHead>:last-child{justify-self:end}
.sheetBody{flex:1;overflow-y:auto;padding:4px var(--gut) 44px}
.sheetBody::-webkit-scrollbar{width:0}

/* ---------- lecteur de séance ---------- */
.woTop{padding:14px var(--gut) 0}
.woProg{display:flex;gap:3px;margin:12px 0 4px}
.woProg i{flex:1;height:3px;border-radius:2px;background:var(--line);display:block}
.woProg i.done{background:var(--accent)}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:16px 0}
.stepper button{width:62px;height:62px;border-radius:50%;background:var(--panel2);border:0;color:var(--text);font-size:28px;font-weight:300;cursor:pointer}
.stepper button:active{background:var(--line)}
.stepVal{text-align:center;flex:1}
.stepVal b{display:block;font-size:34px;font-stretch:112%;font-weight:620;letter-spacing:-.03em;line-height:1.1}
.stepVal span{font-size:12.5px;color:var(--faint)}
.rest{text-align:center;padding:7vh 0 10px}
.restNum{font-size:78px;font-stretch:108%;font-weight:300;letter-spacing:-.04em;line-height:1}
.target{display:flex;gap:26px;margin:12px 0;flex-wrap:wrap}
.target div small{display:block;font-size:11.5px;color:var(--faint)}
.target div b{font-size:19px;font-stretch:108%;font-weight:620}

/* ---------- connexion ---------- */
#login{background:var(--ink);align-items:center;justify-content:center;padding:26px}
.loginBox{width:100%;max-width:330px;text-align:center}
.loginBox h1{font-size:34px;margin-bottom:4px}
.loginBox form{text-align:left;margin:26px 0 4px}
.mark{width:54px;height:54px;margin-bottom:14px}

/* ---------- divers ---------- */
#toast{position:absolute;left:50%;bottom:86px;transform:translateX(-50%) translateY(14px);background:var(--panel2);
  border:1px solid var(--line);padding:11px 18px;border-radius:14px;font-size:13.5px;opacity:0;transition:.22s;pointer-events:none;z-index:40;max-width:88%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
#simbar{display:none;background:#33260E;color:var(--mid);font-size:12.5px;padding:7px var(--gut);text-align:center}
#simbar a{text-decoration:underline}
.sync{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--faint);cursor:pointer}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.dot[data-st=ok]{background:var(--good)}.dot[data-st=sync],.dot[data-st=pending]{background:var(--accent)}
.dot[data-st=offline]{background:var(--mid)}
details summary{cursor:pointer;color:var(--dim);font-size:13px;padding:6px 0;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:'+ ';color:var(--faint)}
details[open] summary::before{content:'– '}
.empty{color:var(--dim);font-size:14px;padding:18px 2px;line-height:1.55}
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 calc(-1 * var(--gut));padding:2px var(--gut) 6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{height:0}
.ev{flex:none;width:150px;background:var(--panel);border-radius:var(--r-m);padding:13px 14px;cursor:pointer}
.evDays{font-size:27px;font-stretch:112%;font-weight:620;letter-spacing:-.02em;line-height:1}
.exrow{padding:11px 0;border-bottom:1px solid var(--line2)}
.exrow:last-child{border-bottom:0}
.pre{white-space:pre-wrap}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

/* ---------- schémas de mouvement ---------- */
.mv{--mv-body:var(--text);--mv-load:var(--mid);--mv-line:var(--line);width:100%;height:auto;display:block}
.mvBox{background:var(--panel2);border-radius:var(--r-m);padding:6px;aspect-ratio:1;display:grid;place-items:center}
.mvBox.sm{width:76px;height:76px;padding:2px;flex:none;aspect-ratio:auto}
.mvRow{display:flex;gap:14px;align-items:center}

/* ---------- coach ---------- */
.verdict{border-radius:var(--r-l);padding:18px;margin:14px 0 10px;background:
  linear-gradient(180deg,color-mix(in srgb,var(--c) 17%,var(--panel)),var(--panel))}
.verdictTop{display:flex;gap:12px;align-items:flex-start}
.verdictTop .ic{color:var(--c);flex:none;display:flex;margin-top:1px}
.verdict h2{letter-spacing:-.016em}
.sig{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line2)}
.sig:last-child{border-bottom:0}
.sig i{width:7px;height:7px;border-radius:50%;margin-top:7px;flex:none;background:var(--c)}
.prop{background:var(--panel2);border-radius:var(--r-s);padding:12px 14px;margin:8px 0;display:flex;gap:12px;align-items:center}
.prop .grow{font-size:13.5px}

/* ---------- tableaux de données ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:right;font-weight:500;color:var(--faint);font-size:11.5px;padding:0 0 6px}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{text-align:right;padding:7px 0;border-top:1px solid var(--line2);font-variant-numeric:tabular-nums}
.tbl td.bar{width:38%;padding-left:10px}
.tbl i{display:block;height:7px;border-radius:4px;background:var(--c,var(--accent))}
.zrow{display:flex;align-items:center;gap:10px;padding:5px 0}
.zrow .zl{width:92px;font-size:12.5px;color:var(--dim);flex:none}
.zrow .zb{flex:1;height:9px;border-radius:5px;background:var(--line2);overflow:hidden}
.zrow .zb i{display:block;height:100%;background:var(--c)}
.zrow .zv{width:52px;text-align:right;font-size:12.5px;flex:none}
.pr{display:flex;gap:10px;overflow-x:auto;margin:0 calc(-1*var(--gut));padding:2px var(--gut) 8px;scrollbar-width:none}
.pr::-webkit-scrollbar{height:0}
.prCard{flex:none;min-width:104px;background:var(--panel);border-radius:var(--r-m);padding:12px 14px}
.prCard b{display:block;font-size:19px;font-stretch:112%;font-weight:620;letter-spacing:-.02em}

/* ---------- classes héritées des fenêtres de détail, redessinées ---------- */
.t2{color:var(--dim)}.t3{color:var(--faint)}.b{font-weight:620}.warn{color:var(--mid)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 8px;font-size:16.5px;font-weight:640;letter-spacing:-.008em}
.sec small{font-size:12.5px;font-weight:400;color:var(--faint)}
.badge{display:inline-flex;align-items:center;font-size:12px;font-stretch:94%;padding:3px 9px;border-radius:999px;color:var(--c,var(--dim));background:color-mix(in srgb,var(--c,var(--faint)) 15%,transparent);white-space:nowrap}
.srow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:5px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid2>.card,.grid2>.tile,.grid3>.card{margin:0}
.tile{background:var(--panel);border-radius:var(--r-m);padding:14px 15px}

// ===== Moteur (portage JavaScript de CockpitCore) =====

const p2 = n => String(n).padStart(2, '0');
const DAYMS = 86400000;
const MONTHS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const WEEKDAYS = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];

const D = {
  num(iso) { const [y, m, d] = iso.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / DAYMS); },
  iso(n) { return new Date(n * DAYMS).toISOString().slice(0, 10); },
  add(iso, n) { return D.iso(D.num(iso) + n); },
  diff(a, b) { return D.num(b) - D.num(a); },
  wd(iso) { return ((D.num(iso) + 3) % 7 + 7) % 7 + 1; },
  monday(iso) { return D.add(iso, -(D.wd(iso) - 1)); },
  range(a, b) { const o = []; for (let n = D.num(a); n <= D.num(b); n++) o.push(D.iso(n)); return o; },
  realToday() { const t = new Date(); return `${t.getFullYear()}-${p2(t.getMonth() + 1)}-${p2(t.getDate())}`; },
  ofTime(ms) { const t = new Date(ms); return `${t.getFullYear()}-${p2(t.getMonth() + 1)}-${p2(t.getDate())}`; },
  at(iso, h, m = 0) { const [y, mo, d] = iso.split('-').map(Number); return new Date(y, mo - 1, d, h, m).getTime(); },
  short(iso) { const [, m, d] = iso.split('-').map(Number); return `${d} ${MONTHS[m - 1]}`; },
  long(iso) { return `${WEEKDAYS[D.wd(iso) - 1]} ${D.short(iso)} ${iso.slice(0, 4)}`; },
  wdLabel(iso) { return WEEKDAYS[D.wd(iso) - 1]; }
};

const St = {
  mean: a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null,
  sd(a) { if (a.length < 2) return null; const m = St.mean(a); return Math.sqrt(a.reduce((s, x) => s + (x - m) ** 2, 0) / (a.length - 1)); },
  median(a) { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), n = s.length; return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2; },
  linreg(x, y) {
    const n = x.length; if (n < 2) return null;
    const mx = St.mean(x), my = St.mean(y); let sxx = 0, sxy = 0, syy = 0;
    for (let i = 0; i < n; i++) { sxx += (x[i] - mx) ** 2; sxy += (x[i] - mx) * (y[i] - my); syy += (y[i] - my) ** 2; }
    if (sxx === 0) return null;
    const b = sxy / sxx, a = my - b * mx, res = x.map((xi, i) => y[i] - (a + b * xi)), sse = res.reduce((s, r) => s + r * r, 0);
    const s2 = n > 2 ? sse / (n - 2) : null;
    return { slope: b, intercept: a, r2: syy > 0 ? 1 - sse / syy : null, res, seB: s2 != null ? Math.sqrt(s2 / sxx) : null, seA: s2 != null ? Math.sqrt(s2 * (1 / n + mx * mx / sxx)) : null, n };
  }
};

const EWMA = {
  lambda: (tau, dt = 1) => 1 - Math.exp(-dt / tau),
  update: (prev, v, gap, tau) => prev == null ? v : EWMA.lambda(tau, Math.max(gap, 0)) * v + (1 - EWMA.lambda(tau, Math.max(gap, 0))) * prev
};

// ----- VFC et références individuelles -----
function classify(z, band = 0.5) { if (z == null) return 'insufficient'; return z < -band ? 'below' : z > band ? 'above' : 'within'; }
const BASE_LABEL = { within: 'Dans ta plage habituelle', below: 'Sous ta plage habituelle', above: 'Au-dessus de ta plage habituelle', insufficient: 'Historique insuffisant' };

function hrvAnalyze(readings, method, c = { win: 60, min: 14, tau: 7, band: 0.5, atyp: 3, lo: 3, hi: 300 }) {
  const byDay = {};
  for (const r of readings) if (r.method === method) byDay[r.date] = r.value;
  const valid = Object.keys(byDay).sort().filter(d => { const v = byDay[d]; return isFinite(v) && v > 0 && v >= c.lo && v <= c.hi; }).map(d => [d, byDay[d], Math.log(byDay[d])]);
  const out = []; let trend = null, last = null;
  valid.forEach(([day, value, ln], idx) => {
    const ws = D.add(day, -c.win);
    const base = valid.slice(0, idx).filter(v => v[0] >= ws && v[0] < day).map(v => v[2]);
    const flags = []; let mean = null, sd = null, z = null;
    if (base.length >= c.min) { mean = St.mean(base); sd = St.sd(base); if (sd > 0) z = (ln - mean) / sd; else flags.push('Écart-type de référence nul'); }
    else flags.push(`Référence : ${base.length}/${c.min} jours valides`);
    if (z != null && Math.abs(z) > c.atyp) flags.push('Valeur atypique : vérifier la mesure');
    trend = EWMA.update(trend, ln, last ? D.diff(last, day) : 1, c.tau); last = day;
    const tz = (mean != null && sd > 0) ? (trend - mean) / sd : null;
    out.push({ date: day, value, ln, mean, sd, n: base.length, z, trend, tz, status: classify(z, c.band), trendStatus: classify(tz, c.band), flags });
  });
  return out;
}

function baselineAnalyze(map, win = 60, min = 14, tau = 7, band = 0.5) {
  const items = Object.keys(map).filter(k => isFinite(map[k])).sort().map(k => [k, map[k]]);
  const out = []; let trend = null, last = null;
  items.forEach(([day, v], i) => {
    const ws = D.add(day, -win);
    const base = items.slice(0, i).filter(x => x[0] >= ws && x[0] < day).map(x => x[1]);
    let mean = null, sd = null, z = null;
    if (base.length >= min) { mean = St.mean(base); sd = St.sd(base); if (sd > 0) z = (v - mean) / sd; }
    trend = EWMA.update(trend, v, last ? D.diff(last, day) : 1, tau); last = day;
    const tz = (mean != null && sd > 0) ? (trend - mean) / sd : null;
    out.push({ date: day, value: v, mean, sd, n: base.length, z, trend, tz, status: classify(z, band), trendStatus: classify(tz, band) });
  });
  return out;
}

// ----- Sommeil -----
function sleepSummary(nights, end, needH = 8) {
  const by = {}; for (const n of nights) by[n.date] = n;
  const last7 = D.range(D.add(end, -6), end).map(d => by[d]).filter(Boolean);
  const def = n => Math.max(0, needH * 60 - n.sleepMin);
  let ew = null, last = null;
  for (const d of Object.keys(by).sort()) { if (d > end) continue; ew = EWMA.update(ew, def(by[d]), last ? D.diff(last, d) : 1, 7); last = d; }
  const pts = D.range(D.add(end, -27), end).map((d, i) => by[d] ? [i, by[d].sleepMin] : null).filter(Boolean);
  const fit = pts.length >= 7 ? St.linreg(pts.map(p => p[0]), pts.map(p => p[1])) : null;
  const effs = last7.filter(n => n.inBedMin > 0 && n.sleepMin <= n.inBedMin).map(n => n.sleepMin / n.inBedMin * 100);
  const n7 = last7.length;
  return { nights: n7, missing: 7 - n7, avg: St.mean(last7.map(n => n.sleepMin)), deficit: last7.reduce((s, n) => s + def(n), 0), ewma: ew,
    eff: St.mean(effs), trend: fit ? fit.slope : null,
    deep: St.mean(last7.filter(n => n.deepMin != null).map(n => n.deepMin / n.sleepMin * 100)),
    rem: St.mean(last7.filter(n => n.remMin != null).map(n => n.remMin / n.sleepMin * 100)),
    conf: n7 === 0 ? 'insufficient' : n7 <= 3 ? 'low' : n7 <= 5 ? 'moderate' : 'high' };
}

// ----- TRIMP et charge -----
function trimpWeight(hrr, sex) { const [k, b] = sex === 'female' ? [0.86, 1.67] : [0.64, 1.92]; const x = Math.min(1, Math.max(0, hrr)); return x * k * Math.exp(b * x); }
function trimpBanister(samples, rest, max, sex, maxGap = 30) {
  // samples : [[t, hr], ...] ; somme de Riemann à gauche, pauses > maxGap exclues.
  if (!(max > rest) || !(rest > 0)) return null;
  const s = samples.filter(x => x[1] != null && isFinite(x[1])).sort((a, b) => a[0] - b[0]);
  if (s.length < 2) return null;
  let tot = 0, counted = 0, excl = 0, invalid = 0, above = 0;
  for (let i = 0; i < s.length - 1; i++) {
    const dt = s[i + 1][0] - s[i][0]; if (dt <= 0) continue;
    if (dt > maxGap) { excl += dt / 60; continue; }
    const hr = s[i][1]; if (hr < 25 || hr > 250) { invalid++; continue; }
    const hrr = (hr - rest) / (max - rest); if (hrr > 1) above++;
    tot += dt / 60 * trimpWeight(hrr, sex); counted += dt / 60;
  }
  return { trimp: tot, counted, excl, invalid, above };
}
function trimpFromAverage(avg, minutes, rest, max, sex) { if (!(max > rest)) return null; return minutes * trimpWeight((avg - rest) / (max - rest), sex); }

function loadStates(loads, restDays, from, to) {
  const la = EWMA.lambda(7), lc = EWMA.lambda(42); let atl = 0, ctl = 0; const out = []; const unk = [];
  D.range(from, to).forEach((d, n) => {
    let status, load;
    if (loads[d] != null && isFinite(loads[d])) { status = 'recorded'; load = loads[d]; }
    else if (restDays.has(d)) { status = 'rest'; load = 0; } else { status = 'unknown'; load = 0; }
    atl = la * load + (1 - la) * atl; ctl = lc * load + (1 - lc) * ctl; unk.push(status === 'unknown');
    out.push({ date: d, load, status, atl, ctl, tsb: ctl - atl, acwr: ctl >= 1 ? atl / ctl : null, initW: Math.exp(-(n + 1) / 42), unknown42: unk.slice(-42).filter(Boolean).length });
  });
  return out;
}
const kmEffort = (km, up) => km + up / 100;
function recentVsRef(map, end, win = 3, ref = 28) {
  const sum = last => { let s = 0; for (let k = 0; k < win; k++) s += map[D.add(last, -k)] || 0; return s; };
  const recent = sum(end); const refs = []; for (let k = win; k < win + ref; k++) refs.push(sum(D.add(end, -k)));
  const m = St.mean(refs); return { recent, ref: m, ratio: m > 0 ? recent / m : null };
}

// ----- Course -----
const VDOT = {
  vo2: v => -4.60 + 0.182258 * v + 0.000104 * v * v,
  frac: t => 0.8 + 0.1894393 * Math.exp(-0.012778 * t) + 0.2989558 * Math.exp(-0.1932605 * t),
  of(dist, secs) { const t = secs / 60; return VDOT.vo2(dist / t) / VDOT.frac(t); },
  vel(vo2) { const a = 0.000104, b = 0.182258, c = -4.60 - vo2; return (-b + Math.sqrt(b * b - 4 * a * c)) / (2 * a); },
  predict(dist, v) { let lo = 1, hi = 60000; for (let i = 0; i < 200; i++) { const m = (lo + hi) / 2; if (VDOT.of(dist, m) > v) lo = m; else hi = m; } return (lo + hi) / 2; },
  pace(v, min = 60) { return 1000 / VDOT.vel(v * VDOT.frac(min)) * 60; }
};
function csFit(points) {
  const u = points.filter(p => p.max && p.d > 0 && p.t > 0);
  if (u.length < 2) return null;
  const f = St.linreg(u.map(p => p.t), u.map(p => p.d)); if (!f) return null;
  const warn = []; const out = u.filter(p => p.t < 120 || p.t > 900).length;
  if (out) warn.push(`${out} effort(s) hors de 2–15 min : CS probablement biaisée`);
  if (f.intercept < 0) warn.push('D′ négatif : données incohérentes');
  else if (f.intercept < 50 || f.intercept > 500) warn.push(`D′ de ${Math.round(f.intercept)} m, hors des valeurs habituelles (environ 100 à 300 m) : tes efforts n'étaient probablement pas tous maximaux`);
  if (u.length === 2) warn.push('Deux points : aucune estimation d\'erreur');
  let conf = u.length === 2 ? 'low' : u.length === 3 ? 'moderate' : 'high'; if (out || f.intercept < 50 || f.intercept > 500) conf = 'low';
  return { cs: f.slope, dp: f.intercept, r2: f.r2, res: f.res, se: f.seB, n: u.length, tmin: Math.min(...u.map(p => p.t)), tmax: Math.max(...u.map(p => p.t)), warn, conf };
}
const minettiCost = i => (i < -0.45 || i > 0.45) ? null : 155.4 * i ** 5 - 30.4 * i ** 4 - 43.3 * i ** 3 + 46.3 * i * i + 19.5 * i + 3.6;
function decoupling(samples) {
  // samples : [t, hr, speed, dist, alt]
  const s = [...samples].sort((a, b) => a[0] - b[0]); const reasons = [];
  if (s.length < 10) return { pct: null, ok: false, reasons: ['Trop peu d\'échantillons'] };
  const iv = []; let pause = 0, total = 0;
  for (let i = 0; i < s.length - 1; i++) {
    const dt = s[i + 1][0] - s[i][0]; if (dt <= 0) continue; total += dt;
    if (dt > 30) { pause += dt; continue; }
    if (!(s[i][1] > 0) || s[i][2] == null) continue;
    const climb = (s[i][4] != null && s[i + 1][4] != null) ? Math.max(0, s[i + 1][4] - s[i][4]) : 0;
    iv.push({ dt, v: s[i][2], hr: s[i][1], up: climb });
  }
  const moving = iv.reduce((a, x) => a + x.dt, 0);
  if (moving / 60 < 40) reasons.push('Durée en mouvement inférieure à 40 min');
  if (total > 0 && pause / total > 0.1) reasons.push(`Pauses trop importantes (${Math.round(pause / total * 100)} %)`);
  let acc = 0; const a = [], b = [];
  for (const x of iv) { (acc + x.dt / 2 <= moving / 2 ? a : b).push(x); acc += x.dt; }
  const ef = p => { const t = p.reduce((q, x) => q + x.dt, 0); if (!t) return null; const v = p.reduce((q, x) => q + x.v * x.dt, 0) / t * 60, h = p.reduce((q, x) => q + x.hr * x.dt, 0) / t; return v / h; };
  const u1 = a.reduce((q, x) => q + x.up, 0), u2 = b.reduce((q, x) => q + x.up, 0);
  if (Math.abs(u1 - u2) > 60) reasons.push(`Profil différent entre les moitiés (D+ ${Math.round(u1)} vs ${Math.round(u2)} m)`);
  const e1 = ef(a), e2 = ef(b); const pct = e1 && e2 ? (e1 - e2) / e1 * 100 : null;
  return { e1, e2, pct, ok: !reasons.length && pct != null, reasons };
}

// ----- Force -----
const Str = {
  epley: (w, r) => r <= 1 ? w : w * (1 + r / 30),
  brzycki: (w, r) => r >= 37 ? null : w * 36 / (37 - r),
  oneRM(w, r, f) { return f === 'epley' ? Str.epley(w, r) : Str.brzycki(w, r); },
  estimate(load, reps, rir, f = 'brzycki') {
    if (!(load > 0) || reps < 1) return null;
    const rEff = reps + Math.max(0, rir ?? 0); if (rEff > 15) return null;
    const value = Str.oneRM(load, rEff, f); if (value == null) return null;
    let rel = 'high'; const notes = [];
    if (rir == null) { rel = 'moderate'; notes.push('RIR non renseigné : série supposée à l\'échec'); }
    if (rir != null && rir > 4) { rel = 'moderate'; notes.push('RIR élevé : estimation moins précise'); }
    if (rEff > 10) { rel = 'low'; notes.push('Plus de 10 répétitions effectives'); }
    return { value, rEff, rel, notes, f };
  },
  suggest(orm, reps, rir, f = 'brzycki', inc = 1.25) {
    const rEff = reps + Math.max(0, rir); const raw = f === 'epley' ? (rEff <= 1 ? orm : orm / (1 + rEff / 30)) : orm * (37 - rEff) / 36;
    return inc > 0 ? Math.floor(raw / inc + 1e-9) * inc : raw;
  },
  inol: (reps, pct) => (pct >= 100 || pct < 0) ? null : reps / (100 - pct),
  stim(reps, rir, th = 4) { if (reps <= 0 || rir < 0) return 0; const firstK = Math.ceil(reps + rir - th); return Math.max(0, Math.min(reps, reps - Math.max(1, firstK) + 1)); }
};
const RANK = { insufficient: 0, low: 1, moderate: 2, high: 3 };

function volumeByMuscle(sets, lib) {
  const out = {}; const sess = {};
  const get = m => out[m] || (out[m] = { m, direct: 0, fract: 0, hard: 0, tonnage: 0, reps: 0, freq: 0, stim: 0 });
  for (const s of sets) {
    if (s.warm) continue; const e = lib[s.ex]; if (!e) continue;
    const hard = (s.rir ?? 0) <= 4, stim = Str.stim(s.reps, s.rir ?? 0);
    for (const m of e.p) { const v = get(m); v.direct++; v.fract++; if (hard) v.hard++; v.tonnage += s.load * s.reps; v.reps += s.reps; v.stim += stim; (sess[m] = sess[m] || new Set()).add(s.sid); }
    for (const m of e.s) if (!e.p.includes(m)) get(m).fract += 0.5;
  }
  for (const m in sess) out[m].freq = sess[m].size;
  return out;
}

// ----- Énergie et nutrition -----
const Energy = {
  cunningham: lbm => 500 + 22 * lbm,
  mifflin: (m, h, a, sex) => 10 * m + 6.25 * h - 5 * a + (sex === 'female' ? -161 : 5),
  tef: (p, c, f) => 0.25 * p * 4 + 0.075 * c * 4 + 0.02 * f * 9,
  adaptive(intake, weight, end, win = 21) {
    const start = D.add(end, -(win - 1));
    const ins = D.range(start, end).map(d => intake[d]).filter(v => v > 0);
    const ws = D.range(start, end).map((d, i) => weight[d] > 0 ? [i, weight[d]] : null).filter(Boolean);
    if (ins.length < 7 || ws.length < 5) return null;
    const f = St.linreg(ws.map(x => x[0]), ws.map(x => x[1])); if (!f) return null;
    const mean = St.mean(ins), tdee = mean - 7700 * f.slope, cov = ins.length / win;
    let conf = 'low'; if (ws.length >= 10 && cov >= 0.8) conf = 'moderate'; if (win >= 21 && ws.length >= 15 && cov >= 0.9) conf = 'high';
    return { tdee, slope: f.slope, mean, range: f.seB != null ? [tdee - 1.96 * f.seB * 7700, tdee + 1.96 * f.seB * 7700] : null, conf, nIn: ins.length, nW: ws.length };
  }

async function unzipFiles(buf) {

// ===================== Analyses avancées =====================
// Tout ce qui est calculé ici est descriptif. Les modèles sont nommés, leur domaine de validité
// est vérifié, et chaque résultat porte une confiance. Rien n'est extrapolé en silence.

const BEST_DISTS = [400, 800, 1000, 1609, 3000, 5000, 10000, 15000, 21097.5, 42195];
const DIST_LABEL = { 400: '400 m', 800: '800 m', 1000: '1 km', 1609: '1 mile', 3000: '3 km', 5000: '5 km', 10000: '10 km', 15000: '15 km', 21097.5: 'Semi', 42195: 'Marathon' };
const FOOT = new Set(['running', 'trailRunning', 'trackRunning', 'treadmillRunning']);

// ----- Meilleurs efforts d'une activité : temps le plus court couvrant chaque distance -----
function bestEfforts(samples, dists = BEST_DISTS) {
  const s = samples.filter(x => x[3] != null).sort((a, b) => a[0] - b[0]);
  const out = {};
  if (s.length < 3) return out;
  const span = s[s.length - 1][3] - s[0][3];
  for (const target of dists) {
    if (span < target) continue;
    let best = Infinity, j = 1;
    for (let i = 0; i < s.length - 1; i++) {
      if (j <= i) j = i + 1;
      while (j < s.length && s[j][3] - s[i][3] < target) j++;
      if (j >= s.length) break;
      const prev = s[j - 1], seg = s[j][3] - prev[3];
      const frac = seg > 0 ? (target - (prev[3] - s[i][3])) / seg : 0;
      const t = prev[0] + frac * (s[j][0] - prev[0]) - s[i][0];
      if (t > 0 && t < best) best = t;
    }
    if (isFinite(best)) out[target] = best;
  }
  return out;
}

// ----- Allure corrigée de la pente (coût énergétique de Minetti et al., 2002) -----
const FLAT_COST = minettiCost(0);

}
// Vitesse plate équivalente moyenne d'une activité

  let num = 0, den = 0;
  for (let i = 0; i < s.length - 1; i++) {
    const dt = s[i + 1][0] - s[i][0];
    if (!(dt > 0) || dt > 30 || !(s[i][2] > 0.5)) continue;
    const dd = (s[i + 1][3] != null && s[i][3] != null) ? s[i + 1][3] - s[i][3] : s[i][2] * dt;
    const da = (s[i + 1][4] != null && s[i][4] != null) ? s[i + 1][4] - s[i][4] : 0;
    num += gapSpeed(s[i][2], dd > 0 ? da / dd : 0) * dt; den += dt;
  }

}

// ----- Tours au kilomètre -----
function splits(samples, unit = 1000) {
  const s = samples.filter(x => x[3] != null).sort((a, b) => a[0] - b[0]);
  if (s.length < 3) return [];
  const out = []; let mark = s[0][3] + unit, t0 = s[0][0], alt0 = s[0][4], hrSum = 0, hrT = 0, gapNum = 0, gapDen = 0;
  for (let i = 0; i < s.length - 1; i++) {

    if (dt > 0 && dt <= 30) {

        const dd = s[i + 1][3] - s[i][3], da = (s[i + 1][4] != null && s[i][4] != null) ? s[i + 1][4] - s[i][4] : 0;
        gapNum += gapSpeed(s[i][2], dd > 0 ? da / dd : 0) * dt; gapDen += dt;
      }

    if (s[i + 1][3] >= mark) {
      const seg = s[i + 1][3] - s[i][3], frac = seg > 0 ? (mark - s[i][3]) / seg : 0;
      const t = s[i][0] + frac * (s[i + 1][0] - s[i][0]);
      const alt = s[i][4] != null && s[i + 1][4] != null ? s[i][4] + frac * (s[i + 1][4] - s[i][4]) : null;
      out.push({ km: out.length + 1, s: t - t0, hr: hrT ? hrSum / hrT : null, up: alt != null && alt0 != null ? alt - alt0 : null, gap: gapDen ? gapNum / gapDen : null });
      t0 = t; alt0 = alt; mark += unit; hrSum = hrT = gapNum = gapDen = 0;

  if (restD > unit * 0.15) out.push({ km: out.length + 1, partial: restD / unit, s: s[s.length - 1][0] - t0, hr: hrT ? hrSum / hrT : null, up: alt0 != null && s[s.length - 1][4] != null ? s[s.length - 1][4] - alt0 : null, gap: gapDen ? gapNum / gapDen : null });

}

// ----- Réserve anaérobie D′ au fil de l'effort (forme différentielle de Skiba) -----
function dPrimeBalance(samples, cs, dp) {

  const s = samples.filter(x => x[2] != null).sort((a, b) => a[0] - b[0]);
  let bal = dp, min = dp; const curve = [];
  for (let i = 0; i < s.length - 1; i++) {
    const dt = s[i + 1][0] - s[i][0]; if (!(dt > 0) || dt > 30) continue;
    const v = s[i][2];
    if (v > cs) bal -= (v - cs) * dt;
    else bal += (dp - bal) * (1 - Math.exp(-(cs - v) * dt / dp));
    bal = Math.min(dp, bal); if (bal < min) min = bal;
    curve.push([s[i][0], bal]);

}

// ----- Répartition en zones de fréquence cardiaque -----
const ZONE_LABEL = ['Sous Z1', 'Z1 récupération', 'Z2 endurance', 'Z3 tempo', 'Z4 seuil', 'Z5 maximale'];
const ZONE_COLOR = ['var(--line)', 'var(--deep)', 'var(--accent)', 'var(--good)', 'var(--mid)', 'var(--low)'];
// Trois domaines (Seiler) : facile sous le premier seuil, intermédiaire, dur au-dessus du second

  const tot = easy + mod + hard;
  if (!tot) return null;
  const p = [easy / tot * 100, mod / tot * 100, hard / tot * 100];
  const shape = p[0] >= 75 && p[2] >= 5 && p[1] <= 15 ? 'polarisée' : p[1] > 25 ? 'centrée sur le seuil' : p[0] >= 85 ? 'surtout facile' : 'pyramidale';
  return { easy, mod, hard, pct: p, total: tot, shape };
}

// ----- Monotonie et contrainte hebdomadaires (Foster et al., 1998) -----
function fosterWeek(loadByDay, from, to) {
  const v = D.range(from, to).map(d => loadByDay[d] || 0);
  const total = v.reduce((a, b) => a + b, 0), m = St.mean(v), sd = St.sd(v);
  if (!total || !sd) return null;

// ----- Meilleurs efforts de l'historique, et modèles de prédiction -----
function allBests(activities, from) {
  const best = {}, where = {};
  for (const a of activities) {
    if (!ROAD.has(a.sport) || !a.samples?.length) continue;
    if (from && D.ofTime(a.start) < from) continue;
    const b = bestEfforts(a.samples);
    for (const d in b) if (!best[d] || b[d] < best[d]) { best[d] = b[d]; where[d] = a.id; }
  }
  return { best, where };
}
// Exposant de Riegel ajusté sur ses propres records plutôt que la valeur générique de 1,06

  if (pts.length < 3) return null;
  const f = St.linreg(pts.map(p => p[0]), pts.map(p => p[1]));

  return { k: f.slope, r2: f.r2, n: pts.length, predict: d => Math.exp(f.intercept + f.slope * Math.log(d)) };
}
// Plusieurs modèles indépendants ; on montre l'accord ou le désaccord entre eux
function racePrediction(dist, ctx) {

  const { best, riegel, cs } = ctx;
  const ref = Object.entries(best).map(([d, t]) => ({ d: +d, t })).filter(p => p.t >= 180 && p.t <= 3600).sort((a, b) => b.d - a.d)[0];
  if (ref) {
    const v = VDOT.of(ref.d, ref.t);
    out.push({ name: 'VDOT (Daniels)', t: VDOT.predict(dist, v), note: `d'après ton ${DIST_LABEL[ref.d] || Math.round(ref.d) + ' m'} en ${fmtDur(ref.t)}` });
  }

  if (cs && RANK[cs.conf] >= 2 && dist <= 21098) {
    const t = (dist - cs.dp) / cs.cs;
    if (t > 0) out.push({ name: 'Vitesse critique', t, note: dist > 15000 ? 'au-delà du domaine du modèle' : `CS ${fx(cs.cs * 3.6, 2)} km/h`, weak: dist > 15000 });
  }
  const strong = out.filter(o => !o.weak);
  if (!strong.length) return { models: out, range: null };
  const ts = strong.map(o => o.t);
  return { models: out, range: [Math.min(...ts), Math.max(...ts)], spread: (Math.max(...ts) - Math.min(...ts)) / Math.min(...ts) };

// ----- Efficacité aérobie sur les sorties faciles -----
function efSeries(activities, maxHR) {
  const out = [];
  for (const a of activities) {
    if (!FOOT.has(a.sport) || !a.samples?.length || !a.avgHR) continue;
    const z = timeInZones(a.samples.filter(x => x[1]), maxHR), tot = z.reduce((x, y) => x + y, 0);
    if (!tot || (z[4] + z[5]) / tot > 0.08) continue;          // on écarte les séances intenses
    const g = activityGap(a.samples); if (!g) continue;
    out.push([D.num(D.ofTime(a.start)), g.v * 60 / a.avgHR, a.id]);   // mètres par minute et par battement
  }

}

// ----- Force : pente de progression de la force estimée -----
function strengthTrend(series, weeks = 8) {
  if (series.length < 3) return null;
  const cut = series[series.length - 1][0] - weeks * 7;
  const pts = series.filter(p => p[0] >= cut);
  if (pts.length < 3) return null;

// Tonnage hebdomadaire par muscle principal
function tonnage(strength, lib, from, to) {
  const out = {};
  for (const s of strength) {
    const d = D.ofTime(s.start); if (d < from || d > to) continue;
    for (const x of s.sets) {
      if (x.warm || !(x.load > 0) || !(x.reps > 0)) continue;
      const e = lib[x.ex]; if (!e) continue;
      for (const m of e.p) out[m] = (out[m] || 0) + x.load * x.reps;

// Série hebdomadaire du volume par muscle (séries principales)
function weeklyVolume(strength, lib, weeks, endDay) {

    for (const s of strength) {

      for (const x of s.sets) { if (x.warm) continue; const e = lib[x.ex]; if (!e) continue; for (const m of e.p) by[m] = (by[m] || 0) + 1; }

// ----- Cache par activité -----
const ANA = new Map();
function anaOf(a) {
  const key = a.id + '|' + (a.samples?.length || 0);
  if (ANA.has(key)) return ANA.get(key);
  const P = S.profile, smp = a.samples || [];
  const r = { splits: [], best: {}, zones: null, three: null, gap: null, dp: null };
  if (smp.length > 2 && FOOT.has(a.sport)) {
    r.splits = splits(smp);
    r.best = bestEfforts(smp);
    r.gap = activityGap(smp);
  }
  if (smp.some(x => x[1]) && P.maxHR) { r.zones = timeInZones(smp, P.maxHR); r.three = threeZones(r.zones); }
  const cs = csCurrent();
  if (cs && RANK[cs.conf] >= 2 && FOOT.has(a.sport) && smp.length > 2) r.dp = dPrimeBalance(smp, cs.cs, cs.dp);
  ANA.set(key, r);
  return r;
}

// ----- Vitesse critique : efforts maximaux saisis à la main, complétés par les records mesurés -----
let CS_CACHE = { key: null, val: null, bests: null };
function csCurrent() { return csBundle().cs; }
function csBundle() {
  const key = S.activities.length + '|' + (S.perfs || []).length + '|' + S.activities.filter(a => a.samples).length;
  if (CS_CACHE.key === key) return CS_CACHE.val;
  const { best, where } = allBests(S.activities);
  const pts = (S.perfs || []).map(p => ({ d: p.d, t: p.t, max: p.max, src: 'manuel' }));
  for (const d in best) if (best[d] >= 120 && best[d] <= 900) pts.push({ d: +d, t: best[d], max: true, src: 'mesuré', act: where[d] });
  // un seul point par distance : le meilleur
  const byD = {};
  for (const p of pts) if (!byD[p.d] || p.t < byD[p.d].t) byD[p.d] = p;
  const used = Object.values(byD);
  const val = { cs: csFit(used), used, best, where, riegel: riegelFit(best) };
  CS_CACHE = { key, val };
  return val;
}

// ===================== Sommeil =====================
// Score explicite, construit à partir de quatre composantes mesurables. Ce n'est pas le score Garmin,
// et ce n'est pas une mesure clinique : c'est un résumé de ce que tes propres données montrent.
const SLEEP_PARTS = [
  { id: 'duration', label: 'Durée', max: 50 },
  { id: 'continuity', label: 'Continuité', max: 20 },
  { id: 'stages', label: 'Phases', max: 15 },
  { id: 'regularity', label: 'Régularité', max: 15 }
];
function sleepScore(day, needH) {
  const m = S.metrics[day]; if (!m || !(m.sleepMin > 0)) return null;
  const need = (needH || S.profile.sleepNeed || 8) * 60;
  const parts = {}, missing = [];
  // Durée : pleine au-dessus du besoin, puis deux points perdus pour un point manquant
  const ratio = m.sleepMin / need;
  parts.duration = 50 * Math.max(0, Math.min(1, 1 - 2 * (1 - ratio)));
  parts.ratio = ratio;
  // Continuité : temps éveillé pendant la nuit
  const awake = m.inBedMin != null && m.inBedMin > m.sleepMin ? m.inBedMin - m.sleepMin : m.awakeMin;
  if (awake != null) parts.continuity = 20 * Math.max(0, Math.min(1, (60 - awake) / 40));
  else missing.push('continuity');
  // Phases : part de sommeil profond et paradoxal dans les fourchettes usuelles de l'adulte
  if (m.deepMin != null && m.remMin != null && m.sleepMin > 0) {
    const deep = m.deepMin / m.sleepMin, rem = m.remMin / m.sleepMin;
    const band = (v, lo, hi) => v >= lo && v <= hi ? 1 : Math.max(0, 1 - (v < lo ? (lo - v) / lo : (v - hi) / hi) * 2);
    parts.stages = 15 * (band(deep, 0.13, 0.23) * 0.5 + band(rem, 0.20, 0.25) * 0.5);
  } else missing.push('stages');
  // Régularité : dispersion de l'heure d'endormissement sur 14 nuits
  const starts = D.range(D.add(day, -13), day).map(d => S.metrics[d]?.sleepStart).filter(v => v != null)
    .map(v => v > 720 ? v - 1440 : v);        // ramène 23 h 30 à −30 min pour éviter la coupure de minuit
  if (starts.length >= 5) {
    const sd = St.sd(starts);
    parts.regularity = 15 * Math.max(0, Math.min(1, (90 - sd) / 60));
    parts.regularitySd = sd;
  } else missing.push('regularity');
  const used = SLEEP_PARTS.filter(p2 => parts[p2.id] != null);
  const got = used.reduce((a, p2) => a + parts[p2.id], 0), maxi = used.reduce((a, p2) => a + p2.max, 0);
  const score = Math.round(got / maxi * 100);
  const weak = used.filter(p2 => parts[p2.id] / p2.max < 0.7).sort((x, y) => parts[x.id] / x.max - parts[y.id] / y.max)[0];
  return { score, parts, missing, used, weak, conf: missing.length === 0 ? 'high' : missing.length === 1 ? 'moderate' : 'low',
    need, sleepMin: m.sleepMin, awake, deepMin: m.deepMin, remMin: m.remMin, lightMin: m.lightMin, start: m.sleepStart, prov: m.sleepProv };
}
const SLEEP_WORD = s => s >= 85 ? 'Excellente nuit' : s >= 72 ? 'Bonne nuit' : s >= 58 ? 'Nuit correcte' : s >= 42 ? 'Nuit juste' : 'Mauvaise nuit';
const WEAK_TIP = { duration: 'C\'est la durée qui manque : tout le reste était bon.', continuity: 'Nuit hachée : tu es resté éveillé longtemps au milieu.',
  stages: 'Répartition des phases inhabituelle pour toi — alcool, repas tardif ou séance tard le soir en sont les causes les plus fréquentes.',
  regularity: 'Tes heures de coucher sont très variables : c\'est le levier le plus simple à corriger.' };
function sleepSeries(day, n = 30) {
  return D.range(D.add(day, -(n - 1)), day).map(d => ({ d, s: sleepScore(d) })).filter(x => x.s);
}

// ----- Trace GPS : projection locale simple, suffisante pour dessiner un parcours -----
function routeOf(samples) {
  const pts = samples.filter(x => x[5] != null && x[6] != null);
  if (pts.length < 8) return null;
  const lat0 = St.mean(pts.map(p => p[5])), k = Math.cos(lat0 * Math.PI / 180);
  const xs = pts.map(p => p[6] * k), ys = pts.map(p => -p[5]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const w = x1 - x0 || 1e-6, h = y1 - y0 || 1e-6, sc = 1 / Math.max(w, h);
  return { pts: pts.map((p, i) => [(xs[i] - x0) * sc, (ys[i] - y0) * sc]), ratio: w / h, n: pts.length };
}

// ===================== VO2max =====================
// Plusieurs estimations indépendantes, chacune avec sa source et sa limite. Aucune n'est une mesure :
// toutes passent par une performance ou une fréquence cardiaque, donc elles mélangent consommation
// maximale d'oxygène, économie de course et gestion de l'allure.
const BEST_DURS = [360, 720, 1200, 1800, 3600];
function bestDistances(samples, durs = BEST_DURS) {
  const s = samples.filter(x => x[3] != null).sort((a, b) => a[0] - b[0]);
  const out = {};
  if (s.length < 3) return out;
  const span = s[s.length - 1][0] - s[0][0];
  for (const T of durs) {
    if (span < T) continue;
    let best = 0, j = 1;
    for (let i = 0; i < s.length - 1; i++) {
      if (j <= i) j = i + 1;
      while (j < s.length && s[j][0] - s[i][0] < T) j++;
      if (j >= s.length) break;
      const prev = s[j - 1], dt = s[j][0] - prev[0];
      const frac = dt > 0 ? (T - (prev[0] - s[i][0])) / dt : 0;
      const d = prev[3] + frac * (s[j][3] - prev[3]) - s[i][3];

}
// Meilleures distances sur une fenêtre, à plat sur toutes les sorties sur route
function allBestDistances(from, to) {
  const out = {}, where = {};
  for (const a of S.activities) {
    if (!ROAD.has(a.sport) || !a.samples?.length) continue;
    const d = D.ofTime(a.start); if ((from && d < from) || (to && d > to)) continue;
    const b = bestDistances(a.samples);
    for (const k in b) if (!out[k] || b[k] > out[k]) { out[k] = b[k]; where[k] = a.id; }
  }
  return { dist: out, where };
}

function vo2maxEstimates(from, to) {
  const P = S.profile, out = [];
  const { dist, where } = allBestDistances(from, to);
  // Demi-Cooper : la vitesse tenue 6 minutes sert de vitesse maximale aérobie
  let mas = null;
  if (dist[360]) {
    mas = dist[360] / 360 * 3.6;
    out.push({ id: 'leger', name: 'Vitesse maximale aérobie', v: 3.5 * mas, src: `6 min à ${fx(mas, 1)} km/h`,
      ref: 'Léger & Mercier, 1984', act: where[360], caveat: 'Juste seulement si ces 6 minutes étaient un vrai effort maximal.' });
    out.push({ id: 'acsm', name: 'Équation de course ACSM', v: 0.2 * (dist[360] / 6) + 3.5, src: `6 min à ${fx(mas, 1)} km/h`,
      ref: 'ACSM, composante horizontale', act: where[360], caveat: 'Valable sur le plat ; la pente et le vent la faussent.' });
  }
  if (dist[720]) out.push({ id: 'cooper', name: 'Test de Cooper', v: (dist[720] - 504.9) / 44.73, src: `${Math.round(dist[720])} m en 12 min`,
    ref: 'Cooper, 1968', act: where[720], caveat: 'Conçu pour un 12 minutes couru à fond, sur piste.' });
  // Daniels : effort entre 3 et 15 minutes
  const { best } = csBundle();
  // On retient le record qui donne le VDOT le plus haut : c'est celui qui était
  // le plus proche d'un effort maximal, les autres étant forcément sous-maximaux.
  const cand = Object.entries(best).map(([d, t]) => ({ d: +d, t, lbl: DIST_LABEL[+d] || Math.round(+d) + ' m' }))
    // Les meilleures distances sur durée fixe comptent aussi : un 6 ou 12 minutes
    // pris dans une sortie est un effort continu, au même titre qu'un record.
    .concat([360, 720].filter(s => dist[s]).map(s => ({ d: dist[s], t: s, lbl: Math.round(dist[s]) + ' m' })))
    .map(p => ({ ...p, v: VDOT.of(p.d, p.t) }))
    .filter(p => p.t >= 180 && p.t <= 900 && isFinite(p.v));
  const ref = cand.sort((a, b) => b.v - a.v)[0];
  if (ref) out.push({ id: 'vdot', name: 'VDOT de Daniels', v: ref.v, src: `${ref.lbl} en ${fmtDur(ref.t)}`,
    ref: 'Daniels & Gilbert', caveat: 'Indice de performance : une bonne économie de course le fait monter sans que la consommation d\'oxygène change.' });
  // Rapport des fréquences cardiaques, indépendant de toute performance
  if (P.maxHR > 100 && P.restingHR > 25) out.push({ id: 'uth', name: 'Rapport FC max / FC repos', v: 15.3 * (P.maxHR / P.restingHR),
    src: `${Math.round(P.maxHR)} / ${Math.round(P.restingHR)} bpm`, ref: 'Uth et al., 2004', se: 2.7,
    caveat: 'Erreur type de 2,7 ml/kg/min chez des hommes entraînés. Très sensible à la fréquence de repos, qui varie avec le sommeil et le stress.' });
  if (P.vo2maxGarmin) out.push({ id: 'garmin', name: 'Estimation de ta montre', v: P.vo2maxGarmin, src: 'Garmin', ref: 'modèle Firstbeat, non public',
    caveat: 'Calculée par la montre à partir de la fréquence cardiaque et de l\'allure ; sa méthode n\'est pas publiée.' });
  const vals = out.map(o => o.v).filter(v => isFinite(v) && v > 20 && v < 95);
  if (!vals.length) return { list: out, median: null, mas };
  const med = St.median(vals), lo = Math.min(...vals), hi = Math.max(...vals);
  return { list: out.sort((a, b) => b.v - a.v), median: med, lo, hi, spread: hi - lo, mas,
    conf: out.length >= 3 && hi - lo <= 5 ? 'high' : out.length >= 2 && hi - lo <= 9 ? 'moderate' : 'low' };
}
// Évolution : une estimation par fenêtre glissante de 28 jours
function vo2Trend(day, weeks = 26) {
  const out = [];
  for (let w = weeks - 1; w >= 0; w--) {
    const to = D.add(day, -7 * w), from = D.add(to, -27);
    const e = vo2maxEstimates(from, to);
    const perf = e.list.filter(x => ['leger', 'cooper', 'vdot', 'acsm'].includes(x.id)).map(x => x.v);
    if (perf.length) out.push([D.num(to), St.median(perf)]);
  }
  return out;
}


// ===================== Schémas de mouvement =====================
// Un pantin articulé en SVG, animé en CSS. Vue de côté sauf mention contraire.
// Chaque schéma montre l'amplitude visée, pas la perfection technique : il complète les consignes, il ne les remplace pas.

const MV_DUR = 2.6;
const kf = (n, a, b) => `@keyframes ${n}{from{transform:${a}}to{transform:${b}}}`;
const an = (n, d = MV_DUR, delay = 0) => `animation:${n} ${d}s cubic-bezier(.42,0,.58,1) ${delay}s infinite alternate`;
const bone = (len, w = 3.4) => `<line x1="0" y1="0" x2="0" y2="${len}" stroke="var(--mv-body)" stroke-width="${w}" stroke-linecap="round"/>`;
const head = (x, y, r = 6.4) => `<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="var(--mv-body)" stroke-width="3"/>`;
const ground = `<line x1="8" y1="93" x2="92" y2="93" stroke="var(--mv-line)" stroke-width="2.5" stroke-linecap="round"/>`;
const plate = (cx, cy) => `<g stroke="var(--mv-load)" stroke-width="3.2" stroke-linecap="round"><line x1="${cx - 7}" y1="${cy}" x2="${cx + 7}" y2="${cy}"/><line x1="${cx}" y1="${cy - 4}" x2="${cx}" y2="${cy + 4}"/></g>`;

// Bras : épaule (angle a0→a1) puis coude (b0→b1). Les transformations sont écrites en entier,
// car une transformation CSS remplace l'attribut transform du groupe.
function arm(id, sx, sy, a, b, { upper = 15, fore = 14, hand = '', dim = false } = {}) {
  const css = kf(`${id}s`, `translate(${sx}px,${sy}px) rotate(${a[0]}deg)`, `translate(${sx}px,${sy}px) rotate(${a[1]}deg)`)
    + kf(`${id}e`, `translate(0px,${upper}px) rotate(${b[0]}deg)`, `translate(0px,${upper}px) rotate(${b[1]}deg)`);
  const svg = `<g style="${an(id + 's')}" ${dim ? 'opacity=".32"' : ''}>${bone(upper)}<g style="${an(id + 'e')}">${bone(fore, 3)}<g transform="translate(0,${fore})">${hand}</g></g></g>`;
  return { css, svg };
}
function leg(id, hx, hy, a, b, { thigh = 17, shin = 17, foot = true, dim = false } = {}) {
  const css = kf(`${id}h`, `translate(${hx}px,${hy}px) rotate(${a[0]}deg)`, `translate(${hx}px,${hy}px) rotate(${a[1]}deg)`)
    + kf(`${id}k`, `translate(0px,${thigh}px) rotate(${b[0]}deg)`, `translate(0px,${thigh}px) rotate(${b[1]}deg)`);
  const svg = `<g style="${an(id + 'h')}" ${dim ? 'opacity=".32"' : ''}>${bone(thigh)}<g style="${an(id + 'k')}">${bone(shin, 3.2)}${foot ? `<g transform="translate(0,${shin})"><line x1="0" y1="0" x2="7" y2="0" stroke="var(--mv-body)" stroke-width="3" stroke-linecap="round"/></g>` : ''}</g></g>`;
  return { css, svg };
}
const frame = (css, svg) => `<svg class="mv" viewBox="0 0 100 100" aria-hidden="true"><style>${css}</style>${svg}</svg>`;

const mv = (id, title, build) => { MOVES[id] = { id, title, build }; };

// ===================== Coach =====================
// Des règles explicites, appliquées à tes propres références. Chaque conseil dit sur quoi il s'appuie,
// avec quel seuil et quelle confiance. Rien n'est modifié sans ton accord.

const LVL = { rest: 3, adjust: 2, watch: 1, ok: 0 };

function coachToday(d) {
  const day = d.day, P = S.profile, w = S.wellness[day] || {}, signals = [];
  const add = (lvl, what, detail, conf) => signals.push({ lvl, what, detail, conf });

  // --- Douleur : seul signal qui peut arrêter seul une séance à impact
  if (w.pain >= 5) add('rest', 'Douleur ' + w.pain + '/7' + (w.painLoc ? ` — ${w.painLoc}` : ''), 'Au-dessus de 4, on ne court pas dessus : c\'est le seuil que tu t\'es fixé dans le check-in.', 'high');
  else if (w.pain >= 3) add('adjust', 'Douleur ' + w.pain + '/7' + (w.painLoc ? ` — ${w.painLoc}` : ''), 'Supprime l\'intensité et la descente tant qu\'elle ne redescend pas.', 'high');

  // --- Variabilité cardiaque : la tendance, jamais une journée isolée
  const h = d.hT;
  if (h && h.z != null) {
    const recent = d.hrv.filter(x => x.date >= D.add(day, -2) && x.trendStatus === 'below').length;
    if (h.trendStatus === 'below' && recent >= 2) add('adjust', 'Variabilité basse depuis ' + recent + ' jours', `Tendance sur 7 jours sous ta plage habituelle (écart ${fx(h.z, 1)} écart-type). Une seule journée ne compterait pas.`, 'moderate');
    else if (h.trendStatus === 'below') add('watch', 'Variabilité sous ta plage', 'Un seul jour : à confirmer demain avant d\'en tirer quoi que ce soit.', 'low');
  }
  // --- Fréquence au repos
  const r = d.rT;
  if (r && r.z != null && r.status === 'above' && r.z > 1) add('adjust', 'Fréquence au repos élevée', `${Math.round(r.value)} bpm, soit ${fx(r.z, 1)} écart-type au-dessus de ta plage. Souvent une fatigue ou une infection qui démarre.`, 'moderate');

  // --- Sommeil
  const n = d.lastNight, need = P.sleepNeed || 8;
  if (n && n.sleepMin / 60 < need * 0.75) add('adjust', 'Nuit courte', `${fmtMin(n.sleepMin)} contre ${fx(need, 1)} h de besoin déclaré.`, 'high');
  if (d.sleep.nights >= 5 && d.sleep.deficit / 60 > 5) add('watch', 'Dette de sommeil', `${fx(d.sleep.deficit / 60, 1)} h accumulées sur 7 jours.`, 'moderate');

  // --- Ressenti
  const feels = [['fatigue', 'Fatigue'], ['soreness', 'Courbatures'], ['stress', 'Stress']].filter(([k]) => w[k] >= 6);
  if (feels.length) add('adjust', feels.map(f => f[1]).join(' et ') + ' au plus haut', 'Tu as noté ' + feels.map(f => `${f[1].toLowerCase()} ${w[f[0]]}/7`).join(', ') + ' ce matin.', 'high');

  // --- Charge
  const t = d.trimpStates[d.trimpStates.length - 1];
  if (t) {
    if (t.tsb < -25) add('watch', 'Charge récente lourde', `Écart fatigue/fond de ${Math.round(t.tsb)}. Normal en bloc, à surveiller si ça dure plus de deux semaines.`, t.initW > 0.37 ? 'low' : 'moderate');
    if (t.acwr != null && t.acwr > 1.5) add('watch', 'Montée de charge rapide', `Rapport 7 j / 28 j à ${fx(t.acwr, 2)}. Repère descriptif, pas un prédicteur de blessure.`, 'low');
  }
  const foster = fosterWeek(d.trimpByDay, D.add(day, -6), day);
  if (foster && foster.mono > 2) add('watch', 'Semaine trop uniforme', `Monotonie ${fx(foster.mono, 2)} (Foster) : tes journées se ressemblent trop, il manque du contraste dur/facile.`, 'moderate');

  const worst = signals.reduce((m, s) => Math.max(m, LVL[s.lvl]), 0);
  const adjustN = signals.filter(s => s.lvl === 'adjust').length;
  let level = 'ok';
  if (worst === LVL.rest) level = 'rest';
  else if (adjustN >= 2) level = 'rest';
  else if (adjustN === 1) level = 'adjust';
  else if (signals.length) level = 'watch';

  const sessions = Plan.sessions(day).filter(s => s.t.kind !== 'rest');
  const hard = sessions.filter(s => isHard(s.t.intensity) || s.t.intensity === 'mixed');
  const titles = { ok: 'Fais la séance comme prévu', watch: 'Fais la séance, en restant attentif', adjust: 'Allège aujourd\'hui', rest: 'Repose-toi ou garde le très facile' };
  const heads = {
    ok: sessions.length ? 'Rien dans tes données ne s\'oppose au programme du jour.' : 'Rien de prévu aujourd\'hui, et rien d\'inquiétant dans tes données.',
    watch: 'Un signal sort de l\'ordinaire, mais isolé. Pars comme prévu et arrête si les sensations ne suivent pas.',
    adjust: hard.length ? 'Un signal net pour un jour de séance dure : baisse l\'intensité plutôt que d\'annuler.' : 'Un signal net : garde le volume mais reste facile.',
    rest: 'Plusieurs signaux vont dans le même sens. Le gain d\'une séance dure aujourd\'hui est faible, le coût est réel.'
  };
  if (!signals.length && !Object.keys(S.metrics).length) {
    return { level: 'ok', title: 'Pas encore de quoi te conseiller', head: 'Fais quelques check-ins du matin et connecte ta montre : il faut environ deux semaines pour comparer une journée à tes habitudes.', signals: [], proposals: [] };
  }
  return { level, title: titles[level], head: heads[level], signals: signals.sort((a, b) => LVL[b.lvl] - LVL[a.lvl]), proposals: proposalsFor(level, sessions, day, w) };
}

function proposalsFor(level, sessions, day, w) {
  if (level === 'ok' || level === 'watch') return [];
  const out = [];
  for (const s of sessions) {
    const k = s.t.kind, hard = isHard(s.t.intensity) || s.t.intensity === 'mixed';
    if (level === 'rest') {
      if (k === 'strength' || k === 'mobility') out.push({ key: s.id, to: 'mob_hips_ankles', why: 'Mobilité à la place de la séance de force' });
      else out.push({ key: s.id, to: 'rest', why: 'Repos à la place de ' + s.t.title.toLowerCase() });
    } else if (hard) {
      const alt = k === 'track' || k === 'run' ? 'run_easy_ef' : k === 'trailRun' ? 'run_easy45_60' : k === 'treadmill' ? 'run_ef_30_40' : null;
      if (alt && TPL[alt]) out.push({ key: s.id, to: alt, why: 'Endurance facile à la place de l\'intensité' });
    } else if (k === 'strength') {
      out.push({ key: s.id, light: true, why: 'Même séance, une série de moins par exercice' });
    }
    if (w.pain >= 3 && ['trailRun', 'run', 'track'].includes(k)) out.push({ key: s.id, to: 'bike_z1', why: 'Vélo sans impact tant que la douleur est là' });
  }
  return out;
}

// ===================== Bilan de la semaine =====================
function coachWeek(d, endDay) {
  const to = endDay || d.day, from = D.add(to, -6), prevTo = D.add(from, -1), prevFrom = D.add(prevTo, -6);
  const lib = LIB(), P = S.profile;
  const acts = S.activities.filter(a => { const x = D.ofTime(a.start); return x >= from && x <= to; });
  const prevActs = S.activities.filter(a => { const x = D.ofTime(a.start); return x >= prevFrom && x <= prevTo; });
  const foot = acts.filter(a => FOOT.has(a.sport)), prevFoot = prevActs.filter(a => FOOT.has(a.sport));
  const km = foot.reduce((s, a) => s + (a.dist || 0), 0) / 1000, prevKm = prevFoot.reduce((s, a) => s + (a.dist || 0), 0) / 1000;
  const up = foot.reduce((s, a) => s + (a.up || 0), 0);
  const minutes = acts.reduce((s, a) => s + (a.timer || a.elapsed) / 60, 0);

  // séances prévues contre réalisées
  let planned = 0, done = 0;
  const lk = new Set(Object.keys(linkedMap()));
  for (const dd of D.range(from, to)) for (const s of Plan.sessions(dd)) {
    if (s.t.kind === 'rest' || s.opt) continue;
    planned++;
    if (['completed', 'partial', 'modified'].includes(effectiveStatus(s, lk, d.day))) done++;
  }
  // répartition d'intensité
  const zones = [0, 0, 0, 0, 0, 0];
  if (P.maxHR) for (const a of acts) { const z = anaOf(a).zones; if (z) z.forEach((v, i) => zones[i] += v); }
  const three = threeZones(zones);
  const foster = fosterWeek(d.trimpByDay, from, to);
  const nights = D.range(from, to).map(x => S.metrics[x]?.sleepMin).filter(Boolean);
  const vol = weeklyVolume(S.strength, lib, 2, to);
  const t = d.trimpStates[d.trimpStates.length - 1];
  const ctlPrev = d.trimpStates.find(x => x.date === prevTo);

  const points = [];
  const pt = (lvl, title, text) => points.push({ lvl, title, text });
  if (planned) pt(done >= planned ? 'good' : done >= planned * 0.7 ? 'ok' : 'warn', `${done} séances sur ${planned}`,
    done >= planned ? 'Semaine complète.' : `${planned - done} séance${planned - done > 1 ? 's' : ''} non réalisée${planned - done > 1 ? 's' : ''}. Les séances facultatives ne sont pas comptées.`);
  if (foot.length) pt(Math.abs(km - prevKm) < prevKm * 0.3 || !prevKm ? 'ok' : km > prevKm * 1.3 ? 'warn' : 'ok',
    `${fx(km, 1)} km à pied, D+ ${Math.round(up)} m`,
    prevKm ? `${km >= prevKm ? '+' : ''}${fx((km - prevKm) / prevKm * 100, 0)} % par rapport à la semaine d'avant.` + (km > prevKm * 1.3 ? ' Une hausse de plus de 30 % en une semaine est beaucoup.' : '') : 'Première semaine de référence.');
  if (three) pt(three.shape === 'centrée sur le seuil' ? 'warn' : 'good', `Intensité ${three.shape}`,
    `${Math.round(three.pct[0])} % facile, ${Math.round(three.pct[1])} % intermédiaire, ${Math.round(three.pct[2])} % dur. ` +
    (three.shape === 'centrée sur le seuil' ? 'Trop de temps dans la zone intermédiaire : c\'est fatigant sans être vraiment stimulant (Seiler).' : 'Répartition cohérente avec ce que font les coureurs d\'endurance entraînés.'));
  if (foster) pt(foster.mono > 2 ? 'warn' : 'good', `Monotonie ${fx(foster.mono, 2)}`,
    foster.mono > 2 ? 'Tes journées se ressemblent trop. Durcis les séances dures et facilite franchement les autres.' : 'Bon contraste entre les journées (Foster et al., 1998).');
  if (nights.length >= 4) {
    const avg = St.mean(nights) / 60, need = P.sleepNeed || 8;
    pt(avg >= need * .95 ? 'good' : avg >= need * .85 ? 'ok' : 'warn', `${fx(avg, 1)} h de sommeil en moyenne`,
      avg >= need * .95 ? 'Besoin couvert.' : `${fx(need - avg, 1)} h sous ton besoin chaque nuit, sur ${nights.length} nuits mesurées.`);
  }
  if (t && ctlPrev) {
    const dc = t.ctl - ctlPrev.ctl;
    pt(Math.abs(dc) < 5 ? 'ok' : dc > 0 ? 'good' : 'ok', `Fond ${dc >= 0 ? '+' : ''}${fx(dc, 1)} cette semaine`,
      dc > 7 ? 'Progression rapide : surveille le sommeil et les sensations.' : dc > 0 ? 'Le fond monte.' : 'Le fond baisse légèrement, normal en allègement ou après une coupure.');
  }
  const musc = Object.entries(vol[1]?.by || {}).sort((a, b) => b[1] - a[1]);
  if (musc.length) {
    const drop = musc.filter(([m, v]) => (vol[0].by[m] || 0) - v >= 4);
    pt('ok', `${musc.reduce((s, m) => s + m[1], 0)} séries de musculation`,
      musc.slice(0, 4).map(([m, v]) => `${MUSCLES[m]} ${v}`).join(', ') + (drop.length ? ` — en baisse nette sur ${drop.map(x => MUSCLES[x[0]].toLowerCase()).join(', ')}.` : '.'));
  }
  return { from, to, points, km, prevKm, minutes, up, three, foster, planned, done };
}

// ===================== Progression en musculation =====================
// Double progression : on monte les répétitions dans la fourchette, puis la charge.
function strengthProposals(limitDays = 21) {
  const lib = LIB(), day = today(), cut = D.add(day, -limitDays), out = [];
  const byEx = {};
  for (const s of S.strength) {
    const d = D.ofTime(s.start); if (d < cut) continue;
    for (const x of s.sets) {
      if (x.warm || !(x.reps > 0)) continue;
      (byEx[x.ex] = byEx[x.ex] || []).push({ d, start: s.start, ...x });
    }
  }
  // fourchette prescrite par le programme
  const rx = {};
  for (const t of SESSION_TEMPLATES) for (const b of t.blocks) for (const x of b.ex) if (x.reps && !rx[x.id]) rx[x.id] = x.reps;
  for (const [id, sets] of Object.entries(byEx)) {
    const e = lib[id]; if (!e) continue;
    const last = Math.max(...sets.map(s => s.start));
    const lastSets = sets.filter(s => s.start === last).sort((a, b) => a.n - b.n);
    if (!lastSets.length || !lastSets.some(s => s.load > 0)) continue;
    const range = rx[id] || [8, 12], top = range[1];
    const allTop = lastSets.every(s => s.reps >= top), rirs = lastSets.map(s => s.rir ?? 2);
    const minRir = Math.min(...rirs), load = St.median(lastSets.map(s => s.load));
    const inc = S.profile.inc || 1.25;
    let p = null;
    if (allTop && minRir >= 1) p = { action: 'load', value: load + inc, why: `Toutes tes séries à ${top} répétitions avec au moins ${minRir} en réserve : c'est le moment de monter la charge.` };
    else if (minRir <= 0) p = { action: 'hold', value: load, why: 'Tu as fini à l\'échec ou presque : garde la même charge et vise une répétition de plus avec un peu de marge.' };
    else p = { action: 'reps', value: load, why: `Reste à ${fx(load, load % 1 ? 1 : 0)} kg et ajoute une répétition par série jusqu'à ${top}.` };
    const series = e1rmSeries(id), tr = strengthTrend(series);
    out.push({ id, name: e.name, load, reps: lastSets.map(s => s.reps), rir: minRir, range, when: last, trend: tr, ...p });
  }
  return out.sort((a, b) => b.when - a.when);
}

// ===================== Objectif de course =====================
function raceReadiness(d) {
  const day = d.day;
  const ev = S.events.filter(e => e.start >= day && e.priority === 'a' && e.status !== 'cancelled').sort((a, b) => a.start < b.start ? -1 : 1)[0];
  if (!ev) return null;
  const weeks = Math.max(0, Math.round(D.diff(day, ev.start) / 7));
  const bundle = csBundle();

function dash(day) {

  for (const d in S.metrics) {

    if (m.rhr > 0) rhr[d] = m.rhr;
    if (m.sleepMin > 0) nights.push({ date: d, sleepMin: m.sleepMin, inBedMin: m.inBedMin, deepMin: m.deepMin, remMin: m.remMin, prov: m.sleepProv });
    if (m.intake > 0) intake[d] = m.intake; if (m.weight > 0) weight[d] = m.weight;
  }
  const counts = {}; readings.forEach(r => counts[r.method] = (counts[r.method] || 0) + 1);
  const method = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0] || 'rmssd';
  const hrv = hrvAnalyze(readings, method), rhrR = baselineAnalyze(rhr), sleep = sleepSummary(nights, day, P.sleepNeed || 8);

      const km = (a.dist || 0) / 1000; mech.push({ d, km, up: a.up || 0, down: a.down || 0 }); kmEff[d] = (kmEff[d] || 0) + kmEffort(km, a.up || 0);

    }
  }
  const restDays = new Set();

    const r = S.sessions[k], d = k.split('|')[0]; if (d > day) continue;
    if (r.rpe != null && r.durationMin) srpe[d] = (srpe[d] || 0) + r.rpe * r.durationMin;
    if (r.status === 'completed' && (r.templateId || k.split('|')[2]) === 'rest') restDays.add(d);
  }
  const trimpByDay = trimpDay, trimpStates = loadStates(trimpDay, restDays, from, day), srpeStates = loadStates(srpe, restDays, from, day);
  const wser = { fatigue: {}, soreness: {}, stress: {}, motivation: {} };
  for (const d in S.wellness) { if (d > day) continue; for (const k in wser) if (S.wellness[d][k] != null) wser[k][d] = S.wellness[d][k]; }
  const wToday = {}; for (const k in wser) { const r = baselineAnalyze(wser[k]).pop(); if (r && r.date === day) wToday[k] = r; }
  const hT = hrv.find(x => x.date === day), rT = rhrR.find(x => x.date === day);
  const comp = []; if (hT?.z != null) comp.push(Math.max(-3, Math.min(3, hT.z))); if (rT?.z != null) comp.push(Math.max(-3, Math.min(3, -rT.z)));
  for (const k in wToday) if (wToday[k].z != null) comp.push(Math.max(-3, Math.min(3, (k === 'motivation' ? 1 : -1) * wToday[k].z)));
  const seqs = competitionSequences(S.events), upcoming = S.events.filter(e => e.end >= day && e.status !== 'cancelled').sort((a, b) => a.start < b.start ? -1 : 1);
  const sumMech = (a, b) => { const sel = mech.filter(m => m.d >= a && m.d <= b); const km = sel.reduce((s, m) => s + m.km, 0), up = sel.reduce((s, m) => s + m.up, 0); return { km, up, down: sel.reduce((s, m) => s + m.down, 0), ke: kmEffort(km, up) }; };
  const linked = new Set(S.activities.map(a => a.linked).filter(Boolean));

    todaySessions: Plan.sessions(day), yestSessions: Plan.sessions(D.add(day, -1)), wellness: S.wellness[day], events: upcoming, sequences: seqs });

  trends(mo) {
    const day = today(), d = dash(day), lim = D.add(day, -90), need = S.profile.sleepNeed || 8;
    const hv = d.hrv.filter(x => x.date >= D.add(day, -60)), rh = d.rhr.filter(x => x.date >= D.add(day, -60));
    const sl = D.range(D.add(day, -27), day).map(x => S.metrics[x]?.sleepMin
      ? [D.num(x), S.metrics[x].sleepMin / 60, S.metrics[x].sleepMin / 60 >= need ? 'var(--good)' : 'var(--accent)'] : null).filter(Boolean);
    const load = (states, title, note) => {
      const s = states.filter(x => x.date >= lim);
      if (!s.some(x => x.load > 0)) return sec(title) + hint(note);
      return sec(title, '90 jours') + `<div class="card">${chart({ h: 180, bars: { pts: s.map(x => [D.num(x.date), x.load]), color: 'var(--line)' },

    };
    const blocks = {
      sleep: sec('Sommeil', '28 nuits') + (sl.length ? `<div class="card">${chart({ h: 160, bars: { pts: sl, color: 'var(--accent)' }, rule: need, ruleLabel: 'ton besoin' })}

        : hint('Aucune mesure de variabilité pour l\'instant.')),
      rhr: sec('Fréquence cardiaque au repos', '60 jours') + (rh.length ? `<div class="card">${chart({ h: 150, series: [{ pts: rh.map(x => [D.num(x.date), x.value]), color: 'var(--deep)', fill: true }] })}

        : hint('Aucune fréquence au repos enregistrée.'))

    const order = mo.focus ? [mo.focus, ...Object.keys(blocks).filter(k => k !== mo.focus)] : Object.keys(blocks);
    return { title: 'Courbes', body: order.map(k => blocks[k]).join('') + load(d.trimpStates, 'Charge cardiaque', 'Pas encore de charge : il faut des activités avec fréquence cardiaque.')

// Loi normale centrée réduite : part des journées habituelles situées en dessous de z
function phi(z) {
  const t = 1 / (1 + 0.2316419 * Math.abs(z));
  const d = 0.3989423 * Math.exp(-z * z / 2);
  const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
  return z > 0 ? 1 - p : p;
}
const bandOf = v => v >= 67 ? 'good' : v >= 34 ? 'mid' : 'low';
const BAND_WORD = { good: 'Prêt', mid: 'Moyen', low: 'En dessous' };
const bandColor = b => `var(--${b})`;

function arc(cx, cy, r, a0, a1) {
  const p = (a) => [cx + r * Math.cos(a * Math.PI / 180), cy + r * Math.sin(a * Math.PI / 180)];
  const [x0, y0] = p(a0), [x1, y1] = p(a1);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${Math.abs(a1 - a0) > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}

// Jauge de récupération : part des journées habituelles sous laquelle se situe aujourd'hui
function gauge(d) {
  const A0 = 150, SWEEP = 240, R = 118, CX = 150, CY = 150;
  const val = d.comp == null ? null : Math.round(phi(d.comp) * 100);
  const b = val == null ? 'faint' : bandOf(val);
  const len = Math.PI * R * SWEEP / 180;
  return `<div class="gauge">
    <svg viewBox="0 0 300 212" role="img" aria-label="Récupération ${val ?? 'non calculée'} sur 100">
      <path d="${arc(CX, CY, R, A0, A0 + SWEEP)}" stroke="var(--panel2)" stroke-width="14" fill="none" stroke-linecap="round"/>
      <path d="${arc(CX, CY, R, A0 + SWEEP / 2 - 0.5, A0 + SWEEP / 2 + 0.5)}" stroke="var(--faint)" stroke-width="22" fill="none"/>
      ${val == null ? '' : `<path d="${arc(CX, CY, R, A0, A0 + SWEEP * Math.max(0.004, val / 100))}" stroke="${bandColor(b)}" stroke-width="14" fill="none" stroke-linecap="round"
        style="stroke-dasharray:${len.toFixed(0)};animation:sweep .9s cubic-bezier(.2,.8,.3,1) both"/>`}
      <text x="150" y="112" text-anchor="middle" fill="var(--dim)" style="font-size:14px">Récupération</text>
      <text x="150" y="170" text-anchor="middle" fill="${val == null ? 'var(--faint)' : bandColor(b)}"
        style="font-size:62px;font-stretch:112%;font-weight:600;letter-spacing:-.03em">${val ?? '–'}</text>
      <text x="150" y="198" text-anchor="middle" fill="var(--text)" style="font-size:17px;font-weight:620">${val == null ? 'à construire' : BAND_WORD[b]}</text>
      <style>@keyframes sweep{from{stroke-dashoffset:${len.toFixed(0)}}to{stroke-dashoffset:0}}</style>
    </svg>
    <div class="legs">${recoveryLegs(d).map(l => `<span class="leg"><i class="${l.st ? '' : 'off'}" style="--c:${l.st ? bandColor(l.st) : ''}"></i>${esc(l.name)}</span>`).join('')}</div>
  </div>`;
}
function recoveryLegs(d) {
  const st = (z, good) => z == null ? null : (good ? z : -z) >= 0.5 ? 'good' : (good ? z : -z) <= -0.5 ? 'low' : 'mid';
  const w = S.wellness[d.day] || {};

  const sleepRatio = d.lastNight ? d.lastNight.sleepMin / 60 / (S.profile.sleepNeed || 8) : null;
  return [
    { name: 'Sommeil', st: sleepRatio == null ? null : sleepRatio >= .95 ? 'good' : sleepRatio >= .82 ? 'mid' : 'low' },
    { name: 'VFC', st: st(d.hT?.z, true) },
    { name: 'FC repos', st: st(d.rT?.z, false) },

// Mini-courbe
function spark(pts, color = 'var(--accent)') {
  if (pts.length < 2) return '';
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const X = x => (x - x0) / ((x1 - x0) || 1) * 86 + 2, Y = y => 22 - (y - y0) / ((y1 - y0) || 1) * 18;
  const line = pts.map(p => `${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(' ');
  const last = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 90 26"><polyline points="${line}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" opacity=".85"/><circle cx="${X(last[0]).toFixed(1)}" cy="${Y(last[1]).toFixed(1)}" r="2.4" fill="${color}"/></svg>`;
}

function chart({ series = [], bars = null, band = null, rule = null, h = 170, yMin = null, yMax = null, ruleLabel = '', xFmt = null }) {

  const all = [...series.flatMap(s => s.pts), ...(bars ? bars.pts : []), ...(band ? band.flatMap(b => [[b[0], b[1]], [b[0], b[2]]]) : [])];
  if (!all.length) return '';
  const xs = all.map(p => p[0]); let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) { x0 -= 1; x1 += 1; }
  const ys = all.map(p => p[1]).concat(rule != null ? [rule] : []);
