<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cockpit</title>
<meta name="theme-color" content="#090b0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cockpit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
:root{--bg:#090b0e;--card:#15181d;--card2:#1c2027;--line:#262b33;--t1:#eef1f4;--t2:#9aa3ad;--t3:#6b737d;--t4:#3a414b;--accent:#4fd1c5;--accentSoft:rgba(79,209,197,.14);--warn:#f5ad54;--alert:#fc7373;--calm:#859efa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050608;color:var(--t1);font:15px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;font-variant-numeric:tabular-nums}
body{display:flex;justify-content:center;align-items:stretch}
#app{position:relative;width:100%;max-width:460px;height:100vh;height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 0 1px #14171c,0 20px 60px #000}
@media(min-width:620px){body{align-items:center;padding:16px 0}#app{height:min(940px,calc(100vh - 32px));border-radius:28px}}
#view{flex:1;overflow-y:auto;padding:0 14px 24px}
#simbar{display:none;background:#3a2a10;color:var(--warn);font-size:12px;padding:6px 14px;text-align:center}
#simbar a{color:var(--t1);text-decoration:underline;cursor:pointer}
.tabbar{display:flex;border-top:1px solid var(--line);background:#0d1014;padding:4px 0 max(6px,env(safe-area-inset-bottom))}
.tabbar button{flex:1;background:none;border:0;color:var(--t3);font:inherit;font-size:11px;padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button span{font-size:20px;filter:grayscale(1);opacity:.6}
.tabbar button.on{color:var(--accent)}.tabbar button.on span{filter:none;opacity:1}
h1{font-size:30px;margin:4px 0 6px;letter-spacing:-.5px}h2{font-size:20px;margin:6px 0}
.hdr{padding:18px 0 4px}
.card{background:var(--card);border-radius:14px;padding:12px 14px;margin:8px 0}
.card.hint{color:var(--t2);font-size:13px}
.card.demo{border:1px dashed var(--accent);display:flex;flex-direction:column;gap:10px;font-size:14px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:20px 2px 4px;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--t2)}
.sec small{text-transform:none;letter-spacing:0;font-weight:400;color:var(--t3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid2>.tile,.grid2>.card{margin:0}
.tile{background:var(--card);border-radius:14px;padding:10px 12px;min-height:96px}
.tt{font-size:12px;color:var(--t2)}.tv{font-size:26px;font-weight:600;margin:2px 0}.tv small{font-size:13px;color:var(--t2);font-weight:400;margin-left:3px}
.td{font-size:12px;color:var(--t2)}.tp{font-size:10px;color:var(--t3);margin-top:4px;text-transform:uppercase;letter-spacing:.4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.row.top{align-items:flex-start}
.srow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}
.grow{flex:1;min-width:0}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);white-space:nowrap}
.small{font-size:13px}.tiny{font-size:11.5px}.b{font-weight:600}.t2{color:var(--t2)}.t3{color:var(--t3)}.acc{color:var(--accent)}.warn{color:var(--warn)}.danger{color:var(--alert)!important}.pre{white-space:pre-wrap}
.big{font-size:22px;font-weight:600}.huge{font-size:64px;font-weight:300;text-align:center}
.pad{padding:4px 4px}
.btn{background:var(--card2);color:var(--t1);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font:inherit;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--t4)}.btn.pri{background:var(--accent);color:#06201d;border-color:var(--accent);font-weight:600}
.btn.full{width:100%;margin:6px 0}.btn.sm{padding:5px 10px;font-size:13px;margin:2px}.btn.bigbtn{padding:15px;font-size:17px}
.link{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:4px}.link:disabled{opacity:.3}
a{color:var(--accent);cursor:pointer}
.actions{display:flex;gap:6px;margin:-2px 0 10px;flex-wrap:wrap}
.scard{display:flex;gap:12px;cursor:pointer}.scard:hover{background:var(--card2)}
.sicon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);flex:none;font-size:19px}
.sbody{flex:1;min-width:0}.slot{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.5px}
.stitle{font-weight:600}.ssub{font-size:12.5px;color:var(--t2)}.scond{font-size:12px;color:var(--warn)}
.hscroll{display:flex;gap:8px;overflow-x:auto;margin:8px -14px;padding:0 14px}
.evmini{min-width:128px;max-width:150px;flex:none;cursor:pointer;margin:0}
.obs .oi{font-size:18px;width:20px}details summary{cursor:pointer;margin-top:4px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--line);font-size:13px}.kv:last-child{border:0}.kv span{color:var(--t2)}.kv b{font-weight:500;text-align:right}
.dayh{margin:16px 2px 2px;font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center;text-transform:capitalize}.dayh.today{color:var(--accent)}
.list{padding:2px 0}.li{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px;gap:8px}.li:last-child{border:0}
.click{cursor:pointer}.click:hover{background:var(--card2)}.dim{color:var(--t3)}
.prio{width:30px;height:30px;border-radius:8px;background:var(--card2);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--t2);flex:none}.prio.a{background:var(--warn);color:#2a1700}
.chart{width:100%;height:auto;display:block}.chart .grid{stroke:var(--line);stroke-width:1}.chart .ax{fill:var(--t3);font-size:10px}
.legend{display:flex;gap:12px;font-size:11.5px;margin-top:4px}
.zbar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:6px 0}
.pbar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:6px 0}.pbar i{display:block;height:100%;background:var(--accent)}
.exrow{padding:8px 0;border-bottom:1px solid var(--line)}.exrow:last-child{border:0}
.field{margin:8px 0}.field label{display:block;font-size:12px;color:var(--t2);margin-bottom:4px}
input,select,textarea{width:100%;background:var(--card2);color:var(--t1);border:1px solid var(--line);border-radius:9px;padding:9px 10px;font:inherit;font-size:14px}
input[type=checkbox]{width:auto;accent-color:var(--accent)}input[type=range]{padding:0;accent-color:var(--accent)}
textarea{min-height:64px;resize:vertical}input:focus,select:focus,textarea:focus{outline:1px solid var(--accent)}
.search{margin:4px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px}.chips label{display:flex;gap:4px;align-items:center;color:var(--t1)}
.scale,.seg{display:flex;gap:4px;margin:4px 0}.scale button,.seg button{flex:1;padding:9px 0;background:var(--card2);color:var(--t2);border:1px solid var(--line);border-radius:8px;font:inherit;cursor:pointer}
.scale button.on,.seg button.on{background:var(--accent);color:#06201d;border-color:var(--accent);font-weight:600}
.stepper{display:flex;align-items:center;justify-content:space-between;margin:8px 0;text-align:center}
.stepper button{width:56px;height:56px;border-radius:50%;background:var(--card2);border:1px solid var(--line);color:var(--t1);font-size:26px;cursor:pointer}
.sv{font-size:30px;font-weight:600}.targets{display:flex;gap:24px;margin:8px 0}.targets small{display:block;font-size:11px;color:var(--t3)}.targets b{font-size:18px}
.up{text-transform:uppercase;letter-spacing:.5px}.center{text-align:center;padding:60px 0}
.restp{text-align:center}.restp .grid2{margin:10px 0}
#modal,#workout{position:absolute;inset:0;display:none;background:rgba(0,0,0,.55);z-index:10}#workout{z-index:20}
#modal.on,#workout.on{display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;height:94%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;animation:up .18s ease-out}
#workout .sheet{height:100%;border-radius:0}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
.mhead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 8px;border-bottom:1px solid var(--line)}
.mhead b{text-align:center;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mhead>:first-child{justify-self:start}.mhead>:last-child{justify-self:end}
.mbody{flex:1;overflow-y:auto;padding:4px 14px 30px}
#toast{position:absolute;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);background:#222831;border:1px solid var(--line);padding:9px 16px;border-radius:12px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:90%}
#toast.on{opacity:1;transform:translateX(-50%)}
#cloudDot{position:absolute;top:max(10px,env(safe-area-inset-top));right:14px;z-index:5}
.dot,#cloudDot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--t4)}
.dot[data-st=ok],#cloudDot[data-st=ok]{background:var(--accent)}.dot[data-st=pending],#cloudDot[data-st=pending],.dot[data-st=sync],#cloudDot[data-st=sync]{background:var(--calm)}.dot[data-st=offline],#cloudDot[data-st=offline]{background:var(--warn)}
#login{position:absolute;inset:0;z-index:40;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px}#login.on{display:flex}
.loginbox{width:100%;max-width:340px;text-align:center}.loginbox form{text-align:left;margin:20px 0 12px}.logo{font-size:44px;color:var(--accent)}
#view{padding-top:env(safe-area-inset-top)}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--t4);border-radius:3px}
</style>
</head>
<body>
<div id="app">
  <span id="cloudDot" data-st="idle" title="Local"></span>
  <div id="simbar"></div>
  <main id="view"></main>
  <nav class="tabbar">
    <button data-tab="today"><span>☀️</span>Aujourd'hui</button>
    <button data-tab="plan"><span>📅</span>Programme</button>

    <button data-tab="data"><span>📊</span>Données</button>
  </nav>
  <div id="modal"></div>
  <div id="workout"></div>
  <div id="toast"></div>
  <div id="login"></div>
</div>
<script src="config.js"></script>
<script src="vendor/supabase-2.118.0.js"></script>
<script>

function ex(id, name, sum, cat, p, s, o = {}) {

// ===== Moteur (portage JavaScript de CockpitCore) =====

const p2 = n => String(n).padStart(2, '0');
const DAYMS = 86400000;
const MONTHS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const WEEKDAYS = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];

const D = {
  num(iso) { const [y, m, d] = iso.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / DAYMS); },
  iso(n) { return new Date(n * DAYMS).toISOString().slice(0, 10); },
  add(iso, n) { return D.iso(D.num(iso) + n); },
  diff(a, b) { return D.num(b) - D.num(a); },
  wd(iso) { return ((D.num(iso) + 3) % 7 + 7) % 7 + 1; },
  monday(iso) { return D.add(iso, -(D.wd(iso) - 1)); },
  range(a, b) { const o = []; for (let n = D.num(a); n <= D.num(b); n++) o.push(D.iso(n)); return o; },
  realToday() { const t = new Date(); return `${t.getFullYear()}-${p2(t.getMonth() + 1)}-${p2(t.getDate())}`; },
  ofTime(ms) { const t = new Date(ms); return `${t.getFullYear()}-${p2(t.getMonth() + 1)}-${p2(t.getDate())}`; },
  at(iso, h, m = 0) { const [y, mo, d] = iso.split('-').map(Number); return new Date(y, mo - 1, d, h, m).getTime(); },
  short(iso) { const [, m, d] = iso.split('-').map(Number); return `${d} ${MONTHS[m - 1]}`; },
  long(iso) { return `${WEEKDAYS[D.wd(iso) - 1]} ${D.short(iso)} ${iso.slice(0, 4)}`; },
  wdLabel(iso) { return WEEKDAYS[D.wd(iso) - 1]; }
};

const St = {
  mean: a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null,
  sd(a) { if (a.length < 2) return null; const m = St.mean(a); return Math.sqrt(a.reduce((s, x) => s + (x - m) ** 2, 0) / (a.length - 1)); },
  median(a) { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), n = s.length; return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2; },
  linreg(x, y) {
    const n = x.length; if (n < 2) return null;
    const mx = St.mean(x), my = St.mean(y); let sxx = 0, sxy = 0, syy = 0;
    for (let i = 0; i < n; i++) { sxx += (x[i] - mx) ** 2; sxy += (x[i] - mx) * (y[i] - my); syy += (y[i] - my) ** 2; }
    if (sxx === 0) return null;
    const b = sxy / sxx, a = my - b * mx, res = x.map((xi, i) => y[i] - (a + b * xi)), sse = res.reduce((s, r) => s + r * r, 0);
    const s2 = n > 2 ? sse / (n - 2) : null;
    return { slope: b, intercept: a, r2: syy > 0 ? 1 - sse / syy : null, res, seB: s2 != null ? Math.sqrt(s2 / sxx) : null, seA: s2 != null ? Math.sqrt(s2 * (1 / n + mx * mx / sxx)) : null, n };
  }
};

const EWMA = {
  lambda: (tau, dt = 1) => 1 - Math.exp(-dt / tau),
  update: (prev, v, gap, tau) => prev == null ? v : EWMA.lambda(tau, Math.max(gap, 0)) * v + (1 - EWMA.lambda(tau, Math.max(gap, 0))) * prev
};

// ----- VFC et références individuelles -----
function classify(z, band = 0.5) { if (z == null) return 'insufficient'; return z < -band ? 'below' : z > band ? 'above' : 'within'; }
const BASE_LABEL = { within: 'Dans ta plage habituelle', below: 'Sous ta plage habituelle', above: 'Au-dessus de ta plage habituelle', insufficient: 'Historique insuffisant' };

function hrvAnalyze(readings, method, c = { win: 60, min: 14, tau: 7, band: 0.5, atyp: 3, lo: 3, hi: 300 }) {
  const byDay = {};
  for (const r of readings) if (r.method === method) byDay[r.date] = r.value;
  const valid = Object.keys(byDay).sort().filter(d => { const v = byDay[d]; return isFinite(v) && v > 0 && v >= c.lo && v <= c.hi; }).map(d => [d, byDay[d], Math.log(byDay[d])]);
  const out = []; let trend = null, last = null;
  valid.forEach(([day, value, ln], idx) => {
    const ws = D.add(day, -c.win);
    const base = valid.slice(0, idx).filter(v => v[0] >= ws && v[0] < day).map(v => v[2]);
    const flags = []; let mean = null, sd = null, z = null;
    if (base.length >= c.min) { mean = St.mean(base); sd = St.sd(base); if (sd > 0) z = (ln - mean) / sd; else flags.push('Écart-type de référence nul'); }
    else flags.push(`Référence : ${base.length}/${c.min} jours valides`);
    if (z != null && Math.abs(z) > c.atyp) flags.push('Valeur atypique : vérifier la mesure');
    trend = EWMA.update(trend, ln, last ? D.diff(last, day) : 1, c.tau); last = day;
    const tz = (mean != null && sd > 0) ? (trend - mean) / sd : null;
    out.push({ date: day, value, ln, mean, sd, n: base.length, z, trend, tz, status: classify(z, c.band), trendStatus: classify(tz, c.band), flags });
  });
  return out;
}

function baselineAnalyze(map, win = 60, min = 14, tau = 7, band = 0.5) {
  const items = Object.keys(map).filter(k => isFinite(map[k])).sort().map(k => [k, map[k]]);
  const out = []; let trend = null, last = null;
  items.forEach(([day, v], i) => {
    const ws = D.add(day, -win);
    const base = items.slice(0, i).filter(x => x[0] >= ws && x[0] < day).map(x => x[1]);
    let mean = null, sd = null, z = null;
    if (base.length >= min) { mean = St.mean(base); sd = St.sd(base); if (sd > 0) z = (v - mean) / sd; }
    trend = EWMA.update(trend, v, last ? D.diff(last, day) : 1, tau); last = day;
    const tz = (mean != null && sd > 0) ? (trend - mean) / sd : null;
    out.push({ date: day, value: v, mean, sd, n: base.length, z, trend, tz, status: classify(z, band), trendStatus: classify(tz, band) });
  });
  return out;
}

// ----- Sommeil -----
function sleepSummary(nights, end, needH = 8) {
  const by = {}; for (const n of nights) by[n.date] = n;
  const last7 = D.range(D.add(end, -6), end).map(d => by[d]).filter(Boolean);
  const def = n => Math.max(0, needH * 60 - n.sleepMin);
  let ew = null, last = null;
  for (const d of Object.keys(by).sort()) { if (d > end) continue; ew = EWMA.update(ew, def(by[d]), last ? D.diff(last, d) : 1, 7); last = d; }
  const pts = D.range(D.add(end, -27), end).map((d, i) => by[d] ? [i, by[d].sleepMin] : null).filter(Boolean);
  const fit = pts.length >= 7 ? St.linreg(pts.map(p => p[0]), pts.map(p => p[1])) : null;
  const effs = last7.filter(n => n.inBedMin > 0 && n.sleepMin <= n.inBedMin).map(n => n.sleepMin / n.inBedMin * 100);
  const n7 = last7.length;
  return { nights: n7, missing: 7 - n7, avg: St.mean(last7.map(n => n.sleepMin)), deficit: last7.reduce((s, n) => s + def(n), 0), ewma: ew,
    eff: St.mean(effs), trend: fit ? fit.slope : null,
    deep: St.mean(last7.filter(n => n.deepMin != null).map(n => n.deepMin / n.sleepMin * 100)),
    rem: St.mean(last7.filter(n => n.remMin != null).map(n => n.remMin / n.sleepMin * 100)),
    conf: n7 === 0 ? 'insufficient' : n7 <= 3 ? 'low' : n7 <= 5 ? 'moderate' : 'high' };
}

// ----- TRIMP et charge -----
function trimpWeight(hrr, sex) { const [k, b] = sex === 'female' ? [0.86, 1.67] : [0.64, 1.92]; const x = Math.min(1, Math.max(0, hrr)); return x * k * Math.exp(b * x); }
function trimpBanister(samples, rest, max, sex, maxGap = 30) {
  // samples : [[t, hr], ...] ; somme de Riemann à gauche, pauses > maxGap exclues.
  if (!(max > rest) || !(rest > 0)) return null;
  const s = samples.filter(x => x[1] != null && isFinite(x[1])).sort((a, b) => a[0] - b[0]);
  if (s.length < 2) return null;
  let tot = 0, counted = 0, excl = 0, invalid = 0, above = 0;
  for (let i = 0; i < s.length - 1; i++) {
    const dt = s[i + 1][0] - s[i][0]; if (dt <= 0) continue;
    if (dt > maxGap) { excl += dt / 60; continue; }
    const hr = s[i][1]; if (hr < 25 || hr > 250) { invalid++; continue; }
    const hrr = (hr - rest) / (max - rest); if (hrr > 1) above++;
    tot += dt / 60 * trimpWeight(hrr, sex); counted += dt / 60;
  }
  return { trimp: tot, counted, excl, invalid, above };
}
function trimpFromAverage(avg, minutes, rest, max, sex) { if (!(max > rest)) return null; return minutes * trimpWeight((avg - rest) / (max - rest), sex); }

function loadStates(loads, restDays, from, to) {
  const la = EWMA.lambda(7), lc = EWMA.lambda(42); let atl = 0, ctl = 0; const out = []; const unk = [];
  D.range(from, to).forEach((d, n) => {
    let status, load;
    if (loads[d] != null && isFinite(loads[d])) { status = 'recorded'; load = loads[d]; }
    else if (restDays.has(d)) { status = 'rest'; load = 0; } else { status = 'unknown'; load = 0; }
    atl = la * load + (1 - la) * atl; ctl = lc * load + (1 - lc) * ctl; unk.push(status === 'unknown');
    out.push({ date: d, load, status, atl, ctl, tsb: ctl - atl, acwr: ctl >= 1 ? atl / ctl : null, initW: Math.exp(-(n + 1) / 42), unknown42: unk.slice(-42).filter(Boolean).length });
  });
  return out;
}
const kmEffort = (km, up) => km + up / 100;
function recentVsRef(map, end, win = 3, ref = 28) {
  const sum = last => { let s = 0; for (let k = 0; k < win; k++) s += map[D.add(last, -k)] || 0; return s; };
  const recent = sum(end); const refs = []; for (let k = win; k < win + ref; k++) refs.push(sum(D.add(end, -k)));
  const m = St.mean(refs); return { recent, ref: m, ratio: m > 0 ? recent / m : null };
}

// ----- Course -----
const VDOT = {
  vo2: v => -4.60 + 0.182258 * v + 0.000104 * v * v,
  frac: t => 0.8 + 0.1894393 * Math.exp(-0.012778 * t) + 0.2989558 * Math.exp(-0.1932605 * t),
  of(dist, secs) { const t = secs / 60; return VDOT.vo2(dist / t) / VDOT.frac(t); },
  vel(vo2) { const a = 0.000104, b = 0.182258, c = -4.60 - vo2; return (-b + Math.sqrt(b * b - 4 * a * c)) / (2 * a); },
  predict(dist, v) { let lo = 1, hi = 60000; for (let i = 0; i < 200; i++) { const m = (lo + hi) / 2; if (VDOT.of(dist, m) > v) lo = m; else hi = m; } return (lo + hi) / 2; },
  pace(v, min = 60) { return 1000 / VDOT.vel(v * VDOT.frac(min)) * 60; }

  table: [0x0000, 0xCC01, 0xD801, 0x1400, 0xF001, 0x3C00, 0x2800, 0xE401, 0xA001, 0x6C00, 0x7800, 0xB401, 0x5000, 0x9C01, 0x8801, 0x4400],
  crc(bytes, from, to) {
    let crc = 0;
    for (let i = from; i < to; i++) {
      const b = bytes[i]; let tmp = FIT.table[crc & 0xF]; crc = (crc >> 4) & 0x0FFF; crc = crc ^ tmp ^ FIT.table[b & 0xF];
      tmp = FIT.table[crc & 0xF]; crc = (crc >> 4) & 0x0FFF; crc = crc ^ tmp ^ FIT.table[(b >> 4) & 0xF];
    }
    return crc;
  },
  uint(b, p, n, big) { let v = 0; for (let i = 0; i < n; i++) v = v * 256 + b[p + (big ? i : n - 1 - i)]; return v; },
  num(b, p, size, bt, big) {
    const t = bt & 0x1F, w = { 0: 1, 1: 1, 2: 1, 10: 1, 13: 1, 3: 2, 4: 2, 11: 2, 5: 4, 6: 4, 8: 4, 12: 4 }[t];
    if (!w || size < w) return null;
    const raw = FIT.uint(b, p, w, big);
    switch (t) {
      case 0: case 2: case 13: return raw === 0xFF ? null : raw;
      case 10: return raw === 0 ? null : raw;
      case 1: return raw === 0x7F ? null : (raw > 127 ? raw - 256 : raw);
      case 3: return raw === 0x7FFF ? null : (raw > 32767 ? raw - 65536 : raw);
      case 4: return raw === 0xFFFF ? null : raw;
      case 11: return raw === 0 ? null : raw;
      case 5: return raw === 0x7FFFFFFF ? null : (raw > 0x7FFFFFFF ? raw - 0x100000000 : raw);
      case 6: return raw === 0xFFFFFFFF ? null : raw;
      case 12: return raw === 0 ? null : raw;
      case 8: { if (raw === 0xFFFFFFFF) return null; const dv = new DataView(new ArrayBuffer(4)); dv.setUint32(0, raw); const f = dv.getFloat32(0); return isFinite(f) ? f : null; }
    }
    return null;
  },
  decode(buf) {
    const b = new Uint8Array(buf); let pos = 0; const msgs = []; let parsed = false;
    while (pos < b.length) {
      if (b.length - pos < 12) { if (parsed) break; throw new Error('Fichier trop court pour être un FIT'); }
      const hs = b[pos]; if (hs !== 12 && hs !== 14) { if (parsed) break; throw new Error('En-tête FIT inattendu'); }
      if (String.fromCharCode(b[pos + 8], b[pos + 9], b[pos + 10], b[pos + 11]) !== '.FIT') throw new Error('Signature .FIT absente');
      const size = FIT.uint(b, pos + 4, 4, false), ds = pos + hs, de = ds + size;
      if (de + 2 > b.length) throw new Error('Fichier tronqué');
      if (FIT.uint(b, de, 2, false) !== FIT.crc(b, pos, de)) throw new Error('CRC invalide : fichier corrompu');
      const defs = {}; let p = ds, lastTs = null;
      const read = (def, at) => {
        const m = { g: def.g, f: {}, s: {} }; let q = at;
        for (const fd of def.fields) {
          if ((fd.bt & 0x1F) === 7) { let str = ''; for (let k = 0; k < fd.size && b[q + k]; k++) str += String.fromCharCode(b[q + k]); if (str) m.s[fd.n] = str; }
          else { const v = FIT.num(b, q, fd.size, fd.bt, def.big); if (v != null) m.f[fd.n] = v; }
          q += fd.size;
        }
        return m;
      };
      while (p < de) {
        const h = b[p++];
        if (h & 0x80) {
          const def = defs[(h >> 5) & 3]; if (!def) throw new Error('Message sans définition');
          const m = read(def, p); const off = h & 0x1F;
          if (lastTs != null) { let ts = (lastTs & 0xFFFFFFE0) + off; if (off < (lastTs & 0x1F)) ts += 0x20; m.f[253] = ts; lastTs = ts; }
          p += def.size; msgs.push(m);
        } else if (h & 0x40) {
          const big = b[p + 1] === 1, g = FIT.uint(b, p + 2, 2, big), n = b[p + 4]; p += 5;
          const fields = []; for (let k = 0; k < n; k++) fields.push({ n: b[p + 3 * k], size: b[p + 3 * k + 1], bt: b[p + 3 * k + 2] });
          p += 3 * n; let dev = 0;
          if (h & 0x20) { const nd = b[p++]; for (let k = 0; k < nd; k++) dev += b[p + 3 * k + 1]; p += 3 * nd; }
          defs[h & 0x0F] = { g, big, fields, size: fields.reduce((s, x) => s + x.size, 0) + dev };
        } else {
          const def = defs[h & 0x0F]; if (!def) throw new Error('Message sans définition');
          const m = read(def, p); if (m.f[253] != null) lastTs = m.f[253]; p += def.size; msgs.push(m);
        }
      }
      parsed = true; pos = de + 2;
    }
    return msgs;
  },
  sport(sp, sub) {
    if (sp === 1) return sub === 1 ? 'treadmillRunning' : sub === 3 ? 'trailRunning' : sub === 4 ? 'trackRunning' : 'running';
    if (sp === 2) return (sub === 5 || sub === 6) ? 'indoorCycling' : 'cycling';
    if (sp === 11) return 'walking'; if (sp === 16 || sp === 17) return 'hiking';
    if (sp === 12) return 'crossCountrySkiing'; if (sp === 13) return 'alpineSkiing';
    if (sp === 4 || sp === 10) return sub === 20 ? 'strengthTraining' : sub === 19 ? 'mobility' : 'other';
    return 'other';
  },
  activity(buf) {
    const msgs = FIT.decode(buf), g = n => msgs.filter(m => m.g === n);
    const fid = g(0)[0], ses = g(18)[0], sp = g(12)[0];
    if (fid && fid.f[0] != null && fid.f[0] !== 4) throw new Error('Ce fichier FIT n\'est pas une activité');
    const recs = g(20).filter(r => r.f[253] != null).sort((a, b) => a.f[253] - b.f[253]);
    const sport = FIT.sport(ses?.f[5] ?? sp?.f[0], ses?.f[6] ?? sp?.f[1]);
    const t0 = ses?.f[2] ?? recs[0]?.f[253] ?? fid?.f[4]; if (t0 == null) throw new Error('Aucune donnée exploitable');
    const fields = new Set(), samples = [];
    for (const r of recs) {
      const f = r.f, spd = f[73] != null ? f[73] / 1000 : f[6] != null ? f[6] / 1000 : null;
      const alt = f[78] != null ? f[78] / 5 - 500 : f[2] != null ? f[2] / 5 - 500 : null;
      samples.push([f[253] - t0, f[3] ?? null, spd, f[5] != null ? f[5] / 100 : null, alt]);
      if (f[3] != null) fields.add('FC'); if (spd != null) fields.add('Vitesse'); if (alt != null) fields.add('Altitude');
      if (f[0] != null) fields.add('GPS'); if (f[4] != null) fields.add('Cadence'); if (f[7] != null) fields.add('Puissance');
      if (f[39] != null) fields.add('Oscillation verticale'); if (f[41] != null) fields.add('Temps de contact');
    }
    const hrs = samples.map(s => s[1]).filter(v => v != null);
    const elapsed = ses?.f[7] != null ? ses.f[7] / 1000 : (samples.length ? samples[samples.length - 1][0] : 0);
    const id = 'fitFile:' + (fid?.f[3] != null && fid?.f[4] != null ? `${fid.f[3]}-${fid.f[4]}` : `${t0}-${sport}`);
    if (g(19).length) fields.add('Tours'); if (ses?.f[11] != null) fields.add('Calories');
    // Sous-échantillonnage à 5 s pour limiter le stockage du navigateur.
    const thin = []; let lastT = -1e9;
    for (const s of samples) if (s[0] - lastT >= 5) { thin.push(s); lastT = s[0]; }
    return { id, source: 'fitFile', sport, start: (t0 + 631065600) * 1000, elapsed, timer: ses?.f[8] != null ? ses.f[8] / 1000 : null,
      dist: ses?.f[9] != null ? ses.f[9] / 100 : (samples.filter(s => s[3] != null).pop()?.[3] ?? null), up: ses?.f[22] ?? null, down: ses?.f[23] ?? null,
      avgHR: ses?.f[16] ?? (hrs.length ? St.mean(hrs) : null), maxHR: ses?.f[17] ?? (hrs.length ? Math.max(...hrs) : null), kcal: ses?.f[11] ?? null,
      samples: thin, fields: [...fields], warnings: hrs.length ? [] : ['Aucune fréquence cardiaque dans ce fichier'] };
  }
};

async function unzipFiles(buf) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf); let e = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 66000); i--) if (dv.getUint32(i, true) === 0x06054b50) { e = i; break; }
  if (e < 0) throw new Error('Archive ZIP illisible');
  const count = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true); const out = [];
  for (let k = 0; k < count; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), lo = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(u8.slice(p + 46, p + 46 + nl)); p += 46 + nl + xl + cl;
    if (!/\.fit$/i.test(name)) continue;
    const start = lo + 30 + dv.getUint16(lo + 26, true) + dv.getUint16(lo + 28, true), data = u8.slice(start, start + csize);
    if (method === 0) out.push({ name, buf: data.buffer });
    else if (method === 8) out.push({ name, buf: await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer() });
  }
  return out;
}

// ===================== Agrégation (équivalent de Dashboard.swift) =====================
function dash(day) {
  const P = S.profile, lib = LIB();
  const readings = [], rhr = {}, nights = [], intake = {}, weight = {};
  for (const d in S.metrics) {
    if (d > day) continue; const m = S.metrics[d];
    if (m.hrv > 0) readings.push({ date: d, value: m.hrv, method: m.hrvMethod || 'rmssd' });
    if (m.rhr > 0) rhr[d] = m.rhr;
    if (m.sleepMin > 0) nights.push({ date: d, sleepMin: m.sleepMin, inBedMin: m.inBedMin, deepMin: m.deepMin, remMin: m.remMin, prov: m.sleepProv });
    if (m.intake > 0) intake[d] = m.intake; if (m.weight > 0) weight[d] = m.weight;
  }
  const counts = {}; readings.forEach(r => counts[r.method] = (counts[r.method] || 0) + 1);
  const method = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0] || 'rmssd';
  const hrv = hrvAnalyze(readings, method), rhrR = baselineAnalyze(rhr), sleep = sleepSummary(nights, day, P.sleepNeed || 8);
  const trimpDay = {}, kmEff = {}, mech = [];
  let from = D.add(day, -120);
  for (const a of S.activities) {
    const d = D.ofTime(a.start); if (d > day) continue; if (d < from) from = d;
    if (a.trimp != null) trimpDay[d] = (trimpDay[d] || 0) + a.trimp;
    if (['running', 'trailRunning', 'trackRunning', 'treadmillRunning', 'walking', 'hiking'].includes(a.sport)) {
      const km = (a.dist || 0) / 1000; mech.push({ d, km, up: a.up || 0, down: a.down || 0 }); kmEff[d] = (kmEff[d] || 0) + kmEffort(km, a.up || 0);
    }
  }
  const srpe = {}, legSets = {}, weekSets = [];
  for (const s of S.strength) {
    const d = D.ofTime(s.start); if (d > day) continue;
    if (s.rpe != null && s.end) srpe[d] = (srpe[d] || 0) + s.rpe * (s.end - s.start) / 60000;
    for (const x of s.sets) {
      if (x.warm) continue;
      if (d >= D.add(day, -6)) weekSets.push(Object.assign({ sid: s.id }, x));
      const e = lib[x.ex]; if (e && e.p.some(m => LOWER.has(m)) && (x.rir ?? 0) <= 4) legSets[d] = (legSets[d] || 0) + 1;
    }
  }
  const restDays = new Set();
  for (const k in S.sessions) {
    const r = S.sessions[k], d = k.split('|')[0]; if (d > day) continue;
    if (r.rpe != null && r.durationMin) srpe[d] = (srpe[d] || 0) + r.rpe * r.durationMin;
    if (r.status === 'completed' && (r.templateId || k.split('|')[2]) === 'rest') restDays.add(d);
  }
  const trimpStates = loadStates(trimpDay, restDays, from, day), srpeStates = loadStates(srpe, restDays, from, day);
  const wser = { fatigue: {}, soreness: {}, stress: {}, motivation: {} };
  for (const d in S.wellness) { if (d > day) continue; for (const k in wser) if (S.wellness[d][k] != null) wser[k][d] = S.wellness[d][k]; }
  const wToday = {}; for (const k in wser) { const r = baselineAnalyze(wser[k]).pop(); if (r && r.date === day) wToday[k] = r; }
  const hT = hrv.find(x => x.date === day), rT = rhrR.find(x => x.date === day);
  const comp = []; if (hT?.z != null) comp.push(Math.max(-3, Math.min(3, hT.z))); if (rT?.z != null) comp.push(Math.max(-3, Math.min(3, -rT.z)));
  for (const k in wToday) if (wToday[k].z != null) comp.push(Math.max(-3, Math.min(3, (k === 'motivation' ? 1 : -1) * wToday[k].z)));
  const seqs = competitionSequences(S.events), upcoming = S.events.filter(e => e.end >= day && e.status !== 'cancelled').sort((a, b) => a.start < b.start ? -1 : 1);
  const sumMech = (a, b) => { const sel = mech.filter(m => m.d >= a && m.d <= b); const km = sel.reduce((s, m) => s + m.km, 0), up = sel.reduce((s, m) => s + m.up, 0); return { km, up, down: sel.reduce((s, m) => s + m.down, 0), ke: kmEffort(km, up) }; };
  const linked = new Set(S.activities.map(a => a.linked).filter(Boolean));
  const obs = observations({ today: day, hrv, rhr: rhrR, sleep, trimp: trimpStates[trimpStates.length - 1], kmEff, legSets,
    todaySessions: Plan.sessions(day), yestSessions: Plan.sessions(D.add(day, -1)), wellness: S.wellness[day], events: upcoming, sequences: seqs });
  const wts = Object.keys(weight).sort(); const lastW = wts.length ? weight[wts[wts.length - 1]] : P.massKg;
  const cat = dayCategory(Plan.enduranceMin(day));
  let bmr = null; if (lastW) { if (P.bodyFat != null) bmr = Energy.cunningham(lastW * (1 - P.bodyFat / 100)); else if (P.heightCm && P.birthYear) bmr = Energy.mifflin(lastW, P.heightCm, Number(day.slice(0, 4)) - P.birthYear, P.sex); }
  return { day, method, hrv, rhr: rhrR, sleep, nights, hT, rT, lastNight: nights.find(n => n.date === day), comp: comp.length ? St.mean(comp) : null, compN: comp.length,
    trimpStates, srpeStates, obs, m7: sumMech(D.add(day, -6), day), m28: sumMech(D.add(day, -27), day), vol: volumeByMuscle(weekSets, lib), seqs, upcoming, linked,
    cat, lastW, bmr, tdee: Energy.adaptive(intake, weight, day) };
}

  if (t.kind === 'strength') sum.push(t.blocks.reduce((n, b) => n + b.ex.length, 0) + ' exercices');
  else { const iv = t.blocks.flatMap(b => b.iv)[0]; sum.push(iv ? ivText(iv) : t.obj); }
  return `<div class="card scard" data-a="openSession" data-id="${esc(s.id)}">
    <div class="sicon" style="--c:${KCOL[t.kind]}">${ICON[t.kind]}</div>
    <div class="sbody"><div class="srow"><span class="slot">${LABELS.slot[s.slot]}</span>${s.opt ? badge('Facultative', 'var(--t2)') : ''}${s.deload ? badge('Allègement suggéré', 'var(--calm)') : ''}${s.eventId ? badge('Compétition', 'var(--warn)') : ''}</div>
    <div class="stitle">${esc(t.title)}</div>
    ${compact ? '' : `<div class="ssub">${esc(sum.filter(Boolean).join(' · '))}</div>${s.cond ? `<div class="scond">❓ ${esc(s.cond)}</div>` : ''}`}
    <div class="srow">${badge(LABELS.status[status], SCOL[status])}${act ? `<small class="t2">${fmtMin(act.elapsed / 60)}${act.dist ? ' · ' + fx(act.dist / 1000, 1) + ' km' : ''}</small>` : ''}</div></div></div>`;
}

// ===================== Graphiques SVG =====================
function chart({ series = [], bars = null, band = null, rule = null, h = 160, yMin = null, yMax = null }) {
  const W = 400, H = h, pl = 34, pr = 6, pt = 6, pb = 16;
  const all = [...series.flatMap(s => s.pts), ...(bars ? bars.pts : []), ...(band ? band.flatMap(b => [[b[0], b[1]], [b[0], b[2]]]) : [])];
  if (!all.length) return '';
  const xs = all.map(p => p[0]); let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) { x0 -= 1; x1 += 1; }
  const ys = all.map(p => p[1]).concat(rule != null ? [rule] : []); let y0 = yMin ?? Math.min(...ys), y1 = yMax ?? Math.max(...ys);
  if (bars && yMin == null) y0 = Math.min(0, y0); if (y0 === y1) { y0 -= 1; y1 += 1; } const padY = (y1 - y0) * 0.08; if (yMin == null && !bars) y0 -= padY; y1 += padY;
  const X = x => pl + (x - x0) / (x1 - x0) * (W - pl - pr), Y = y => pt + (1 - (y - y0) / (y1 - y0)) * (H - pt - pb);
  let g = '';
  for (let k = 0; k <= 3; k++) { const v = y0 + (y1 - y0) * k / 3; g += `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${pl - 4}" y="${Y(v) + 3}" class="ax" text-anchor="end">${Math.abs(v) >= 100 ? Math.round(v) : fx(v, Math.abs(v) < 10 ? 1 : 0)}</text>`; }
  g += `<text x="${pl}" y="${H - 3}" class="ax">${D.short(D.iso(x0))}</text><text x="${W - pr}" y="${H - 3}" class="ax" text-anchor="end">${D.short(D.iso(x1))}</text>`;
  if (band) g += `<path d="M${band.map(b => `${X(b[0])},${Y(b[2])}`).join('L')}L${[...band].reverse().map(b => `${X(b[0])},${Y(b[1])}`).join('L')}Z" fill="var(--accentSoft)"/>`;
  if (bars) { const bw = Math.max(1.5, (W - pl - pr) / Math.max(1, x1 - x0 + 1) * 0.7); g += bars.pts.map(p => `<rect x="${X(p[0]) - bw / 2}" y="${Y(Math.max(0, p[1]))}" width="${bw}" height="${Math.abs(Y(0) - Y(p[1]))}" fill="${p[2] || bars.color}" rx="1"/>`).join(''); }
  if (rule != null) g += `<line x1="${pl}" x2="${W - pr}" y1="${Y(rule)}" y2="${Y(rule)}" stroke="var(--warn)" stroke-dasharray="4 4"/>`;
  for (const s of series) {
    if (s.line !== false && s.pts.length > 1) g += `<polyline points="${s.pts.map(p => `${X(p[0])},${Y(p[1])}`).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2"/>`;
    if (s.dots) g += s.pts.map(p => `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="${s.r || 2.5}" fill="${s.color}"/>`).join('');
  }
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">${g}</svg>`;
}

// ===================== Compte et synchronisation Supabase =====================
// Une ligne « cockpit_state » par utilisateur (tout sauf les activités), une ligne par activité,
// courbes des activités chargées à la demande. Copie locale dans le navigateur pour démarrer
// instantanément et fonctionner hors ligne ; les modifications partent vers Supabase 1 s après.
const CFG = Object.assign({ supabaseUrl: '', supabaseAnonKey: '', githubRepo: '', workflow: 'garmin-sync.yml' }, window.COCKPIT_CONFIG || {});
const Cloud = {
  mode: 'local', sb: null, user: null, rev: 0, docJs: null, snap: {}, smUp: new Set(), deleted: new Set(),
  dirty: false, busy: false, again: false, timer: null, state: 'idle', msg: '',

  cacheKey() { return 'cockpit-cache-' + this.user.id; },
  stripAct(a) { const o = {}; for (const k in a) if (k !== 'samples' && k[0] !== '_') o[k] = a[k]; if (a.samples) o.nSamples = a.samples.length; return o; },
  stateDoc() { const o = {}; for (const k in S) if (k !== 'activities') o[k] = S[k]; return o; },
  writeCache() {
    try {
      localStorage.setItem(this.cacheKey(), JSON.stringify({ rev: this.rev, dirty: this.dirty, doc: this.stateDoc(), acts: S.activities.map(a => this.stripAct(a)), snap: this.snap, deleted: [...this.deleted], base: this.dirty ? (this.docJs || this.cachedBase || null) : null }));
    } catch (e) { /* quota : le cloud reste la référence */ }
  },
  baseDoc() { try { return JSON.parse(this.docJs || this.cachedBase || 'null'); } catch (e) { return null; } },
  readCache() { try { return JSON.parse(localStorage.getItem(this.cacheKey()) || 'null'); } catch (e) { return null; } },
  setState(st, msg = '') { this.state = st; this.msg = msg; const el = document.getElementById('cloudDot'); if (el) { el.dataset.st = st; el.title = msg || CLOUD_LABEL[st]; } },

  // appelé par save()
  saved() { this.dirty = true; this.writeCache(); this.setState('pending'); clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 1000); },

  async push() {
    if (this.mode !== 'cloud') return;
    if (this.busy) { this.again = true; return; }
    this.busy = true; this.setState('sync');
    try {
      if (JSON.stringify(this.stateDoc()) !== this.docJs) {
        for (let attempt = 0; attempt < 3; attempt++) {
          const doc = this.stateDoc(), js = JSON.stringify(doc);
          const { data, error } = await this.sb.from('cockpit_state').update({ doc, rev: this.rev + 1 }).eq('user_id', this.user.id).eq('rev', this.rev).select('rev');
          if (error) throw error;
          if (data.length) { this.rev = data[0].rev; this.docJs = js; break; }
          if (attempt === 2) throw new Error('Conflit de version non résolu');
          await this.mergeRemote();           // un autre appareil a enregistré entre-temps ; on renvoie la version fusionnée
          render();
        }
      }
      const withS = [], without = [], present = new Set();
      for (const a of S.activities) {
        present.add(a.id);
        const meta = this.stripAct(a), mj = JSON.stringify(meta), row = { id: a.id, start_at: new Date(a.start).toISOString(), doc: meta };
        if (a.samples && !this.smUp.has(a.id)) withS.push(Object.assign(row, { samples: a.samples }));
        else if (this.snap[a.id] !== mj) without.push(row);
      }
      for (const [rows, label] of [[withS, 8], [without, 100]]) for (let i = 0; i < rows.length; i += label) {
        const part = rows.slice(i, i + label);
        const { error } = await this.sb.from('cockpit_activities').upsert(part, { onConflict: 'user_id,id' });
        if (error) throw error;
        for (const r of part) { this.snap[r.id] = JSON.stringify(r.doc); if (r.samples) this.smUp.add(r.id); }
      }
      const del = [...new Set([...Object.keys(this.snap).filter(id => !present.has(id)), ...this.deleted])];
      for (let i = 0; i < del.length; i += 100) {
        const part = del.slice(i, i + 100);
        const { error } = await this.sb.from('cockpit_activities').delete().in('id', part);
        if (error) throw error;
        part.forEach(id => { delete this.snap[id]; this.deleted.delete(id); });
      }
      this.dirty = false; this.writeCache(); this.setState('ok');
    } catch (e) {
      console.warn('Synchronisation Supabase', e);
      this.writeCache(); this.setState('offline', 'Hors ligne ou erreur : ' + (e.message || e) + '. Nouvel essai automatique.');
      clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 30000);
    } finally {
      this.busy = false;
      if (this.again) { this.again = false; this.push(); }
    }
  },

  async mergeRemote() {
    const { data, error } = await this.sb.from('cockpit_state').select('doc,rev').eq('user_id', this.user.id).maybeSingle();
    if (error) throw error;
    if (!data) return;
    const merged = merge3(this.baseDoc(), data.doc, this.stateDoc());
    S = Object.assign(fresh(), merged, { activities: S.activities });
    this.rev = data.rev; this.docJs = JSON.stringify(data.doc);
    toast('Modifications d\'un autre appareil fusionnées');
  },

  // Récupère l'état distant ; garde les modifications locales non envoyées
  async pull(first) {
    if (this.mode !== 'cloud' || this.busy) return;
    this.setState('sync');
    try {
      const { data: row, error } = await this.sb.from('cockpit_state').select('doc,rev').eq('user_id', this.user.id).maybeSingle();
      if (error) throw error;
      if (!row) {
        const { data, error: e2 } = await this.sb.from('cockpit_state').insert({ doc: this.stateDoc() }).select('rev').single();
        if (e2) throw e2;
        this.rev = data.rev; this.docJs = JSON.stringify(this.stateDoc());
      } else if (row.rev !== this.rev || first) {
        if (this.dirty && row.rev !== this.rev) S = Object.assign(fresh(), merge3(this.baseDoc(), row.doc, this.stateDoc()), { activities: S.activities });
        else if (!this.dirty) S = Object.assign(fresh(), row.doc, { activities: S.activities });
        this.rev = row.rev; this.docJs = JSON.stringify(row.doc);
      }
      // activités : métadonnées seulement (les courbes viennent à la demande)
      const remote = [];
      for (let from = 0; ; from += 1000) {
        const { data, error: e3 } = await this.sb.from('cockpit_activities').select('id,doc').order('start_at', { ascending: false }).range(from, from + 999);
        if (e3) throw e3;
        remote.push(...data); if (data.length < 1000) break;
      }
      const local = new Map(S.activities.map(a => [a.id, a])), next = [];
      this.snap = {};
      for (const r of remote) {
        if (this.deleted.has(r.id)) continue;
        this.snap[r.id] = JSON.stringify(r.doc);
        const l = local.get(r.id);
        if (l && this.dirty && JSON.stringify(this.stripAct(l)) !== this.snap[r.id]) next.push(l);   // modif locale en attente
        else next.push(Object.assign({}, r.doc, l?.samples ? { samples: l.samples } : {}));
        if (l?.samples) this.smUp.add(r.id);
        local.delete(r.id);
      }
      for (const l of local.values()) if (this.dirty && !(l.id in this.snap)) next.push(l);   // créées hors ligne
      S.activities = next;
      await garminMerge();
      this.writeCache();
      if (this.dirty) await this.push(); else this.setState('ok');
    } catch (e) {
      console.warn('Lecture Supabase', e);
      this.setState('offline', 'Hors ligne : données de cet appareil affichées. ' + (e.message || ''));
    }
    render();
  },

  async samples(list) {
    const need = list.filter(a => a.samples === undefined && a.nSamples);
    for (let i = 0; i < need.length; i += 15) {
      const part = need.slice(i, i + 15);
      const { data, error } = await this.sb.from('cockpit_activities').select('id,samples').in('id', part.map(a => a.id));
      if (error) { console.warn(error); continue; }
      const m = new Map(data.map(r => [r.id, r.samples]));
      for (const a of part) { a.samples = m.get(a.id) || []; this.smUp.add(a.id); delete a._smReq; }
    }
  },

  async start() {
    if (!CFG.supabaseUrl || !CFG.supabaseAnonKey || !window.supabase) return false;
    this.sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'cockpit-auth' } });
    const { data } = await this.sb.auth.getSession();
    if (!data.session) { showLogin(); return true; }
    await this.boot(data.session.user);
    return true;
  },

  async boot(user) {
    this.user = user; this.mode = 'cloud';
    document.getElementById('login').className = '';
    const c = this.readCache();
    if (c) {
      S = Object.assign(fresh(), c.doc, { activities: c.acts || [] });
      this.rev = c.rev || 0; this.dirty = !!c.dirty; this.snap = c.snap || {}; this.deleted = new Set(c.deleted || []);
      this.docJs = c.dirty ? null : JSON.stringify(c.doc); this.cachedBase = c.base || null;
    } else { S = fresh(); this.rev = 0; }
    render();
    await this.pull(true);
    if (!S.activities.length && !Object.keys(S.metrics).length) migrateLocalOffer();
    setInterval(() => { if (document.visibilityState === 'visible' && !this.dirty) this.pull(); }, 5 * 60000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !this.dirty) this.pull(); else if (this.dirty) this.push(); });
    window.addEventListener('online', () => this.dirty ? this.push() : this.pull());
  },

  async signOut(wipe) {
    if (this.dirty) await this.push();
    if (wipe) try { localStorage.removeItem(this.cacheKey()); } catch (e) { }
    await this.sb.auth.signOut();
    location.reload();
  }
};
const CLOUD_LABEL = { idle: 'Local', ok: 'Synchronisé', pending: 'Modifications en attente', sync: 'Synchronisation…', offline: 'Hors ligne' };

// Fusion à trois versions (base = dernière version synchronisée sur cet appareil) :
// une valeur modifiée seulement sur un appareil est conservée ; modifiée des deux côtés, la version locale gagne.
// Les listes d'objets identifiés (séances de muscu, adaptations, compétitions…) sont fusionnées élément par élément.
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const isObj = x => x && typeof x === 'object' && !Array.isArray(x);
const isIdList = x => Array.isArray(x) && x.every(e => isObj(e) && 'id' in e);
function merge3(base, remote, local) {
  if (same(local, base)) return remote;
  if (same(remote, base) || same(remote, local)) return local;
  if (isObj(remote) && isObj(local)) {
    const o = {}, b = isObj(base) ? base : {};
    for (const k of new Set([...Object.keys(remote), ...Object.keys(local)])) {
      if (!(k in local)) { if (k in b && same(remote[k], b[k])) continue; o[k] = remote[k]; continue; }   // supprimé localement
      if (!(k in remote)) { if (k in b && same(local[k], b[k])) continue; o[k] = local[k]; continue; }   // supprimé ailleurs
      o[k] = merge3(b[k], remote[k], local[k]);
    }
    return o;
  }
  if (isIdList(remote) && isIdList(local)) {
    const bm = new Map(isIdList(base) ? base.map(x => [x.id, x]) : []), lm = new Map(local.map(x => [x.id, x])), out = [];
    for (const r of remote) {
      if (lm.has(r.id)) { out.push(merge3(bm.get(r.id), r, lm.get(r.id))); lm.delete(r.id); }
      else if (!bm.has(r.id) || !same(r, bm.get(r.id))) out.push(r);   // sinon : supprimé localement
    }
    for (const l of lm.values()) if (!bm.has(l.id) || !same(l, bm.get(l.id))) out.push(l);           // ajouté localement (ou modifié et supprimé ailleurs)
    return out;
  }
  return local;
}

// ===================== Écran de connexion =====================
function showLogin(err) {
  const el = document.getElementById('login'); el.className = 'on';
  el.innerHTML = `<div class="loginbox"><div class="logo">◎</div><h1>Cockpit</h1><div class="t2 small">Entraînement, récupération, musculation</div>
    <form id="loginForm"><div class="field"><label>E-mail</label><input type="email" name="email" autocomplete="username" required></div>
    <div class="field"><label>Mot de passe</label><input type="password" name="password" autocomplete="current-password" required></div>
    <button class="btn pri full" type="submit">Se connecter</button>${err ? `<div class="small danger">${esc(err)}</div>` : ''}</form>
    <div class="tiny t3">Le compte se crée dans Supabase (Authentication › Users › Add user). Voir le README du dépôt.</div></div>`;
  document.getElementById('loginForm').addEventListener('submit', async ev => {
    ev.preventDefault();
    const f = new FormData(ev.target), btn = ev.target.querySelector('button'); btn.disabled = true; btn.textContent = 'Connexion…';
    const { data, error } = await Cloud.sb.auth.signInWithPassword({ email: f.get('email').trim(), password: f.get('password') });
    if (error) return showLogin(/invalid/i.test(error.message) ? 'E-mail ou mot de passe incorrect.' : error.message);
    await Cloud.boot(data.user);
  });
}

// Données créées dans l'aperçu local (même navigateur) : proposer de les envoyer dans le compte
function migrateLocalOffer() {
  let old = null; try { old = JSON.parse(localStorage.getItem('cockpit-local-v1') || localStorage.getItem('cockpit-apercu-v1') || 'null'); } catch (e) { }
  if (!old || !(old.activities?.length || Object.keys(old.metrics || {}).length)) return;
  if (!confirm('Des données Cockpit existent déjà dans ce navigateur (mode local). Les envoyer dans ton compte ?')) return;
  S = Object.assign(fresh(), old); save(); render(); toast('Données envoyées dans ton compte');
}

// ===================== Garmin Connect (API personnelle officielle, synchronisée par GitHub Actions) =====================
LABELS.prov.garmin = 'Garmin';
const GM = { runs: [], poll: null, days: 30, err: null };
const ghToken = () => { try { return localStorage.getItem('cockpit-gh-token') || ''; } catch (e) { return ''; } };

// Intègre ce que GitHub Actions a déposé dans Supabase : jours Garmin, nouvelles activités, comptes rendus
async function garminMerge() {
  if (Cloud.mode !== 'cloud') return;
  const sb = Cloud.sb; S.garmin = S.garmin || {};
  // 1. jours (VFC, sommeil, FC de repos, poids)
  const { data: days, error } = await sb.from('garmin_days').select('day,data,updated_at').gt('updated_at', S.garmin.daysCursor || '1970-01-01T00:00:00Z').order('updated_at', { ascending: true }).limit(2000);
  if (error) console.warn(error);
  const n = { hrv: 0, rhr: 0, sleep: 0, weight: 0, kept: 0 };
  for (const r of days || []) {
    const x = r.data, m = S.metrics[r.day] = S.metrics[r.day] || {};
    const can = prov => !prov || prov === 'garmin' || prov === 'demo';
    if (x.hrv > 0) { if (can(m.hrvProv)) { Object.assign(m, { hrv: x.hrv, hrvMethod: 'rmssd', hrvProv: 'garmin' }); n.hrv++; } else n.kept++; }
    if (x.rhr > 0) { if (can(m.rhrProv)) { Object.assign(m, { rhr: x.rhr, rhrProv: 'garmin' }); n.rhr++; } else n.kept++; }
    if (x.sleepMin > 0) { if (can(m.sleepProv)) { Object.assign(m, { sleepMin: x.sleepMin, inBedMin: x.inBedMin, deepMin: x.deepMin, remMin: x.remMin, sleepProv: 'garmin' }); if (x.sleepScore != null) m.sleepScore = x.sleepScore; n.sleep++; } else n.kept++; }
    if (x.weight > 0) { if (can(m.weightProv) || m.weight == null) { m.weight = x.weight; m.weightProv = 'garmin'; n.weight++; } else n.kept++; }
    S.garmin.daysCursor = r.updated_at;
  }
  // 2. activités déposées par la synchro : TRIMP, doublons, rapprochement avec le programme
  const pending = S.activities.filter(a => a.pending);
  const rep = { ok: 0, dup: 0, auto: 0, pend: 0, err: [] };
  if (pending.length) {
    await Cloud.samples(pending);
    for (const a of pending) {
      delete a.pending;
      S.activities = S.activities.filter(x => x !== a);
      ingest(a, rep);
      if (!S.activities.includes(a)) Cloud.deleted.add(a.id);   // doublon d'un import manuel : retiré
    }
  }
  // 3. comptes rendus
  const { data: runs } = await sb.from('sync_runs').select('*').order('id', { ascending: false }).limit(8);
  GM.runs = runs || [];
  const P = S.profile, filled = [];
  for (const run of GM.runs.filter(r => (r.status === 'done' || r.status === 'error') && !r.merged).reverse()) {
    for (const [k, v] of Object.entries(run.report?.profile || {})) {
      if (k === 'vo2maxGarmin') { P.vo2maxGarmin = v; continue; }
      if (k !== 'sex' && P[k] == null && v != null) { P[k] = v; filled.push(k); }
    }
    await sb.from('sync_runs').update({ merged: true }).eq('id', run.id);
    run.merged = true;
  }
  if (filled.some(k => k === 'restingHR' || k === 'maxHR')) await recomputeTrimp();
  const changed = (days || []).length || pending.length || filled.length;
  if (changed) {
    S.garmin.lastMerge = { at: Date.now(), days: (days || []).length, hrv: n.hrv, sleep: n.sleep, rhr: n.rhr, kept: n.kept, acts: rep.ok, dup: rep.dup, auto: rep.auto, pend: rep.pend, profile: filled };
    save();
    if (rep.ok || n.sleep) toast(`Garmin : ${rep.ok} activité(s), ${n.sleep} nuit(s), ${n.hrv} VFC intégrées`);
  }
  const active = GM.runs.some(r => r.status === 'requested' || r.status === 'running');
  clearTimeout(GM.poll);
  if (active) GM.poll = setTimeout(() => garminMerge().then(render), 15000);
}

const RUN_LABEL = { requested: 'En attente de GitHub Actions', running: 'En cours', done: 'Terminée', error: 'Échec' };
function garminCard() {
  const head = `<div class="sec"><span>Garmin Connect</span><small>API personnelle officielle</small></div>`;
  if (Cloud.mode !== 'cloud') return head + `<div class="card small t2">La synchronisation Garmin passe par ton compte Supabase et GitHub Actions. Mode local : utilise l'import de fichiers FIT ci-dessous.</div>`;
  const last = GM.runs[0], active = GM.runs.find(r => r.status === 'requested' || r.status === 'running'), lm = S.garmin?.lastMerge;
  const fmt = t => t ? new Date(t).toLocaleString('fr-FR', { dateStyle: 'medium', timeStyle: 'short' }) : '–';
  const runRow = r => `<details><summary class="small">${r.status === 'done' ? '✅' : r.status === 'error' ? '⚠️' : '⏳'} ${fmt(r.finished_at || r.started_at || r.requested_at)} · ${RUN_LABEL[r.status]}${r.source === 'auto' ? ' · auto' : ''}${r.range_from ? ` <span class="tiny t3">(${D.short(r.range_from)} → ${D.short(r.range_to)})</span>` : ''}</summary>
    ${r.error ? `<div class="tiny danger">${esc(r.error)}</div>` : ''}${Object.entries(r.report?.counts || {}).map(([k, v]) => `<div class="kv tiny"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}${(r.report?.errors || []).map(e => `<div class="tiny warn">${esc(e)}</div>`).join('')}</details>`;
  return head + `<div class="card">
    ${!GM.runs.length ? `<div class="small">Aucune synchronisation pour l'instant. Une fois ta clé Garmin enregistrée dans les secrets du dépôt GitHub (voir README), lance la première ici.</div>` : ''}
    ${active ? `<div class="small">⏳ ${RUN_LABEL[active.status]}… <span class="tiny t3">demandée ${fmt(active.requested_at)}</span></div><div class="tiny t3">${ghToken() ? 'Lancement immédiat demandé à GitHub.' : 'Prise en charge au prochain passage automatique (toutes les 30 min au plus), ou lance le workflow « Garmin sync » depuis GitHub.'}</div>`
      : `<div class="row"><select id="gmDays" style="width:auto">${[[3, '3 derniers jours'], [7, '7 jours'], [30, '30 jours'], [90, '90 jours'], [180, '180 jours'], [365, '1 an']].map(([d, l]) => `<option value="${d}" ${d === GM.days ? 'selected' : ''}>${l}</option>`).join('')}</select><button class="btn pri" data-a="gmSync">⟳ Synchroniser</button></div>`}
    ${GM.err ? `<div class="tiny danger">${esc(GM.err)}</div>` : ''}
    ${lm ? `<div class="tiny t2" style="margin-top:6px">Dernière intégration ${fmt(lm.at)} : ${lm.acts} activité(s), ${lm.sleep} nuit(s), ${lm.hrv} VFC, ${lm.rhr} FC de repos${lm.kept ? `, ${lm.kept} saisie(s) manuelle(s) conservée(s)` : ''}${lm.pend ? `, ${lm.pend} à valider` : ''}${lm.profile?.length ? ', profil complété' : ''}.</div>` : ''}
    ${GM.runs.length ? `<div style="margin-top:6px">${GM.runs.slice(0, 5).map(runRow).join('')}</div>` : ''}
    <div class="tiny t3" style="margin-top:6px">Synchro automatique toutes les 3 h par GitHub Actions : VFC nocturne (RMSSD), sommeil et phases, FC de repos, poids, activités avec fichier FIT original. Une saisie manuelle n'est jamais écrasée.</div>
    <details><summary class="tiny t2">Lancement immédiat (facultatif)</summary><div class="tiny t3">Sans réglage, une demande est traitée au prochain passage automatique (30 min au plus). Pour un lancement immédiat, colle un jeton GitHub « fine-grained » limité au dépôt ${esc(CFG.githubRepo || 'cockpit')} avec la seule permission « Actions : Read and write ». Il reste sur cet appareil.</div>
      <div class="row"><input type="password" id="ghTok" placeholder="github_pat_…" value="${ghToken() ? '••••••••' : ''}"><button class="btn sm" data-a="ghTokSave">OK</button></div></details></div>`;
}

async function garminRequest() {
  GM.err = null;
  const to = D.realToday(), from = D.add(to, -(GM.days - 1));
  const { error } = await Cloud.sb.from('sync_runs').insert({ source: 'app', status: 'requested', range_from: from, range_to: to });
  if (error) { GM.err = 'Demande impossible : ' + error.message; render(); return; }
  const tok = ghToken();
  if (tok && CFG.githubRepo) {
    try {
      const r = await fetch(`https://api.github.com/repos/${CFG.githubRepo}/actions/workflows/${CFG.workflow}/dispatches`, { method: 'POST', headers: { Authorization: 'Bearer ' + tok, Accept: 'application/vnd.github+json' }, body: JSON.stringify({ ref: 'main' }) });
      if (!r.ok) GM.err = `GitHub refuse le lancement immédiat (${r.status}) : la demande sera traitée au prochain passage automatique.`;
    } catch (e) { GM.err = 'GitHub injoignable : la demande sera traitée au prochain passage automatique.'; }
  }
  toast('Synchronisation Garmin demandée');
  await garminMerge(); render();
}

Object.assign(A, {
  gmSync() { GM.days = +(document.getElementById('gmDays')?.value || 30); garminRequest(); },
  ghTokSave() { const v = document.getElementById('ghTok')?.value.trim(); if (v && !v.startsWith('••')) { try { localStorage.setItem('cockpit-gh-token', v); } catch (e) { } toast('Jeton enregistré sur cet appareil'); } else if (!v) { try { localStorage.removeItem('cockpit-gh-token'); } catch (e) { } toast('Jeton retiré'); } render(); },
  logout() { if (confirm('Se déconnecter ?')) Cloud.signOut(false); },
  logoutWipe() { if (confirm('Se déconnecter et effacer la copie locale de cet appareil ? (Les données restent dans ton compte.)')) Cloud.signOut(true); }
});

(async () => {
  let cloud = false;
  try { cloud = await Cloud.start(); } catch (e) { console.warn(e); }
  if (!cloud) {
    try { const raw = localStorage.getItem(STORE_KEY) || localStorage.getItem('cockpit-apercu-v1'); if (raw) S = Object.assign(fresh(), JSON.parse(raw)); } catch (e) { }
    render();
  }
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
})();
