  if (y0 === y1) { y0 -= 1; y1 += 1; }
  if (yMin == null && !bars) y0 -= (y1 - y0) * .08;
  if (yMax == null) y1 += (y1 - y0) * .08;
  const X = x => pl + (x - x0) / (x1 - x0) * (W - pl - pr), Y = y => pt + (1 - (y - y0) / (y1 - y0)) * (H - pt - pb);
  const uid2 = 'g' + Math.random().toString(36).slice(2, 7);
  let defs = '', g = '';
  const span = y1 - y0, dec = span >= 50 ? 0 : span >= 5 ? 1 : span >= 0.5 ? 2 : 3;
  for (let k = 0; k <= 2; k++) {
    const v = y0 + span * k / 2;
    g += `<line x1="${pl}" x2="${W - pr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" class="grid" stroke-width="1"/>
      <text x="${pl - 6}" y="${(Y(v) + 3.5).toFixed(1)}" class="ax" text-anchor="end">${fx(v, dec)}</text>`;
  }
  const fmtX = xFmt || (x => D.short(D.iso(x)));
  g += `<text x="${pl}" y="${H - 4}" class="ax">${esc(fmtX(x0))}</text><text x="${W - pr}" y="${H - 4}" class="ax" text-anchor="end">${esc(fmtX(x1))}</text>`;
  if (band) g += `<path d="M${band.map(b => `${X(b[0]).toFixed(1)},${Y(b[2]).toFixed(1)}`).join('L')}L${[...band].reverse().map(b => `${X(b[0]).toFixed(1)},${Y(b[1]).toFixed(1)}`).join('L')}Z" fill="var(--accent)" opacity=".12"/>`;
  if (bars) {
    const bw = Math.max(1.6, (W - pl - pr) / Math.max(1, x1 - x0 + 1) * .66);
    g += bars.pts.map(p => `<rect x="${(X(p[0]) - bw / 2).toFixed(1)}" y="${Y(Math.max(0, p[1])).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1, Math.abs(Y(0) - Y(p[1]))).toFixed(1)}" fill="${p[2] || bars.color}" rx="1.5"/>`).join('');
  }
  if (rule != null) {
    g += `<line x1="${pl}" x2="${W - pr}" y1="${Y(rule).toFixed(1)}" y2="${Y(rule).toFixed(1)}" stroke="var(--mid)" stroke-dasharray="3 5" stroke-width="1"/>`;
    if (ruleLabel) g += `<text x="${W - pr}" y="${(Y(rule) - 5).toFixed(1)}" class="ax" text-anchor="end" fill="var(--mid)">${esc(ruleLabel)}</text>`;
  }
  series.forEach((s, i) => {
    const d = s.pts.map(p => `${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join('L');
    if (s.fill && s.pts.length > 1) {
      defs += `<linearGradient id="${uid2}${i}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".34"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient>`;
      g += `<path d="M${d}L${X(s.pts[s.pts.length - 1][0]).toFixed(1)},${Y(y0).toFixed(1)}L${X(s.pts[0][0]).toFixed(1)},${Y(y0).toFixed(1)}Z" fill="url(#${uid2}${i})"/>`;
    }
    if (s.line !== false && s.pts.length > 1) g += `<path d="M${d}" fill="none" stroke="${s.color}" stroke-width="${s.w || 2}" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (s.dots) g += s.pts.map(p => `<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="${s.r || 2.4}" fill="${s.color}" opacity="${s.dotOp || 1}"/>`).join('');
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart"><defs>${defs}</defs>${g}</svg>`;
}

function sleepBars(day, need) {
  const days = D.range(D.add(day, -13), day);
  const max = Math.max(need + 1, ...days.map(x => (S.metrics[x]?.sleepMin || 0) / 60));
  return `<div style="position:relative">
    <div class="bars">${days.map(x => {
      const m = S.metrics[x], h = m?.sleepMin ? m.sleepMin / 60 : 0;
      const col = !h ? 'var(--line2)' : h >= need * .9 ? 'var(--accent)' : 'var(--mid)';
      return `<i style="height:${Math.max(3, h / max * 100)}%;--c:${col}" title="${D.short(x)} : ${h ? fx(h, 1) + ' h' : 'non mesuré'}"></i>`;
    }).join('')}</div>
    <div style="position:absolute;left:0;right:0;bottom:${(need / max * 64).toFixed(1)}px;border-top:1px dashed var(--faint);opacity:.75"></div>
  </div>
  <div class="barLabels"><span>${D.short(days[0])}</span><span>besoin ${fx(need, 1)} h</span><span>${D.short(days[13])}</span></div>`;
}
// Variabilité cardiaque tracée en millisecondes (le calcul reste logarithmique)
function hrvChart(rows, h) {
  if (!rows.length) return '';
  const ex = v => Math.exp(v);
  return chart({ h,
    band: rows.filter(x => x.mean != null).map(x => [D.num(x.date), ex(x.mean - .5 * x.sd), ex(x.mean + .5 * x.sd)]),
    series: [{ pts: rows.map(x => [D.num(x.date), x.value]), color: 'var(--faint)', line: false, dots: true, r: 2 },
             { pts: rows.map(x => [D.num(x.date), ex(x.trend)]), color: 'var(--accent)' }] });
}
function garminStrip() {
  if (typeof Cloud === 'undefined' || Cloud.mode !== 'cloud') return '';
  const g = S.garmin || {}, last = GM.runs?.[0], active = GM.runs?.find(r => r.status === 'requested' || r.status === 'running');
  const when = g.lastMerge ? relTime(g.lastMerge.at) : last?.finished_at ? relTime(Date.parse(last.finished_at)) : null;
  const nAct = S.activities.filter(a => a.source === 'garmin').length;
  const nNights = Object.values(S.metrics).filter(m => m.sleepProv === 'garmin').length;
  return `<div class="card" data-a="garminSheet" style="cursor:pointer">
    <div class="row"><div class="grow"><div class="metricName">${active ? 'Garmin — synchronisation en cours' : when ? 'Garmin — à jour' : 'Garmin — jamais synchronisé'}</div>
      <div class="meta">${active ? 'les données arrivent dans quelques minutes' : when ? `dernière mise à jour ${when} · ${nAct} activités, ${nNights} nuits` : 'connecte ta montre pour remplir l\'app automatiquement'}</div></div>
      <span style="color:var(--${active ? 'accent' : when ? 'good' : 'mid'});flex:none;display:flex">${ic(active ? 'sync' : when ? 'check' : 'alert', 20)}</span></div></div>`;
}
function relTime(ms) {
  const m = (Date.now() - ms) / 60000;
  if (m < 2) return 'à l\'instant';
  if (m < 60) return `il y a ${Math.round(m)} min`;
  if (m < 36 * 60) return `il y a ${Math.round(m / 60)} h`;
  return `il y a ${Math.round(m / 1440)} jours`;
}

function routeMap(samples) {
  const r = routeOf(samples);
  if (!r) return '';
  const W = 400, H = Math.round(Math.max(150, Math.min(320, W / Math.max(0.5, Math.min(2.2, r.ratio))))), pad = 14;
  const sw = W - pad * 2, sh = H - pad * 2, sc = Math.min(sw, sh);
  const ox = pad + (sw - sc * Math.min(1, r.ratio >= 1 ? 1 : r.ratio)) / 2, oy = pad + (sh - sc * Math.min(1, r.ratio >= 1 ? 1 / r.ratio : 1)) / 2;
  const P = p => [ox + p[0] * sc, oy + p[1] * sc];
  const d = r.pts.map((p, i) => { const q = P(p); return `${i ? 'L' : 'M'}${q[0].toFixed(1)} ${q[1].toFixed(1)}`; }).join('');
  const a = P(r.pts[0]), b = P(r.pts[r.pts.length - 1]);
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" style="background:var(--panel2);border-radius:var(--r-s)">
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity=".92"/>
    <circle cx="${a[0].toFixed(1)}" cy="${a[1].toFixed(1)}" r="5" fill="var(--good)"/>
    <circle cx="${b[0].toFixed(1)}" cy="${b[1].toFixed(1)}" r="5" fill="var(--low)"/></svg>
  <div class="legend"><span><i style="--c:var(--good)"></i>départ</span><span><i style="--c:var(--low)"></i>arrivée</span><span class="faint">${r.n} points GPS</span></div>`;
}

// ===================== Compte et synchronisation Supabase =====================
// Une ligne « cockpit_state » par utilisateur (tout sauf les activités), une ligne par activité,

  cacheKey() { return 'cockpit-cache-' + this.user.id; },

  writeCache() {

  setState(st, msg = '') { this.state = st; this.msg = msg; const el = document.getElementById('cloudDot'); if (el) { el.dataset.st = st; el.title = msg || CLOUD_LABEL[st]; } },

  // appelé par save()
  saved() { this.dirty = true; this.writeCache(); this.setState('pending'); clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 1000); },

  async push() {
    if (this.mode !== 'cloud') return;
    if (this.busy) { this.again = true; return; }
    this.busy = true; this.setState('sync');
    try {
      if (JSON.stringify(this.stateDoc()) !== this.docJs) {
        for (let attempt = 0; attempt < 3; attempt++) {
          const doc = this.stateDoc(), js = JSON.stringify(doc);
          const { data, error } = await this.sb.from('cockpit_state').update({ doc, rev: this.rev + 1 }).eq('user_id', this.user.id).eq('rev', this.rev).select('rev');
          if (error) throw error;
          if (data.length) { this.rev = data[0].rev; this.docJs = js; break; }
          if (attempt === 2) throw new Error('Conflit de version non résolu');
          await this.mergeRemote();           // un autre appareil a enregistré entre-temps ; on renvoie la version fusionnée
          render();

      }
      const withS = [], without = [], present = new Set();
      for (const a of S.activities) {

      for (const [rows, label] of [[withS, 8], [without, 100]]) for (let i = 0; i < rows.length; i += label) {

        if (error) throw error;

      const del = [...new Set([...Object.keys(this.snap).filter(id => !present.has(id)), ...this.deleted])];
      for (let i = 0; i < del.length; i += 100) {

    } catch (e) {
      console.warn('Synchronisation Supabase', e);
      this.writeCache(); this.setState('offline', 'Hors ligne ou erreur : ' + (e.message || e) + '. Nouvel essai automatique.');
      clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 30000);

  async mergeRemote() {

    if (error) throw error;
    if (!data) return;
    const merged = merge3(this.baseDoc(), data.doc, this.stateDoc());
    S = Object.assign(fresh(), merged, { activities: S.activities });

  },

  // Récupère l'état distant ; garde les modifications locales non envoyées
  async pull(first) {
    if (this.mode !== 'cloud' || this.busy) return;
    this.setState('sync');
    try {
      const { data: row, error } = await this.sb.from('cockpit_state').select('doc,rev').eq('user_id', this.user.id).maybeSingle();
      if (error) throw error;
      if (!row) {
        const { data, error: e2 } = await this.sb.from('cockpit_state').insert({ doc: this.stateDoc() }).select('rev').single();
        if (e2) throw e2;

  },

  async samples(list) {
    const need = list.filter(a => a.samples === undefined && a.nSamples);

      const part = need.slice(i, i + 15);

  async start() {

  async boot(user) {

const CLOUD_LABEL = { idle: 'Local', ok: 'Synchronisé', pending: 'Modifications en attente', sync: 'Synchronisation…', offline: 'Hors ligne' };

// Fusion à trois versions (base = dernière version synchronisée sur cet appareil) :
// une valeur modifiée seulement sur un appareil est conservée ; modifiée des deux côtés, la version locale gagne.
// Les listes d'objets identifiés (séances de muscu, adaptations, compétitions…) sont fusionnées élément par élément.
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const isObj = x => x && typeof x === 'object' && !Array.isArray(x);
const isIdList = x => Array.isArray(x) && x.every(e => isObj(e) && 'id' in e);
function merge3(base, remote, local) {
  if (same(local, base)) return remote;
  if (same(remote, base) || same(remote, local)) return local;
  if (isObj(remote) && isObj(local)) {
    const o = {}, b = isObj(base) ? base : {};
    for (const k of new Set([...Object.keys(remote), ...Object.keys(local)])) {
      if (!(k in local)) { if (k in b && same(remote[k], b[k])) continue; o[k] = remote[k]; continue; }   // supprimé localement
      if (!(k in remote)) { if (k in b && same(local[k], b[k])) continue; o[k] = local[k]; continue; }   // supprimé ailleurs
      o[k] = merge3(b[k], remote[k], local[k]);
    }
    return o;
  }
  if (isIdList(remote) && isIdList(local)) {
    const bm = new Map(isIdList(base) ? base.map(x => [x.id, x]) : []), lm = new Map(local.map(x => [x.id, x])), out = [];
    for (const r of remote) {
      if (lm.has(r.id)) { out.push(merge3(bm.get(r.id), r, lm.get(r.id))); lm.delete(r.id); }
      else if (!bm.has(r.id) || !same(r, bm.get(r.id))) out.push(r);   // sinon : supprimé localement
    }
    for (const l of lm.values()) if (!bm.has(l.id) || !same(l, bm.get(l.id))) out.push(l);           // ajouté localement (ou modifié et supprimé ailleurs)
    return out;
  }
  return local;
}

  if (u && !/^https?:\/\//.test(u)) return 'L\'adresse dans config.js doit commencer par https://';
  if (/^sb_secret_|service_role/.test(CFG.supabaseAnonKey || '')) return 'config.js contient la clé service_role : utilise la clé anon (publishable).';
  return null;
}

  el.innerHTML = `<div class="loginBox">

  document.getElementById('loginForm').addEventListener('submit', async ev => {

// ===================== Garmin Connect (API personnelle officielle, synchronisée par GitHub Actions) =====================
LABELS.prov.garmin = 'Garmin';
const GM = { runs: [], poll: null, days: 30, err: null };
const ghToken = () => { try { return localStorage.getItem('cockpit-gh-token') || ''; } catch (e) { return ''; } };

// Intègre ce que GitHub Actions a déposé dans Supabase : jours Garmin, nouvelles activités, comptes rendus
async function garminMerge() {
  if (Cloud.mode !== 'cloud') return;
  const sb = Cloud.sb; S.garmin = S.garmin || {};
  // 1. jours (VFC, sommeil, FC de repos, poids)
  const { data: days, error } = await sb.from('garmin_days').select('day,data,updated_at').gt('updated_at', S.garmin.daysCursor || '1970-01-01T00:00:00Z').order('updated_at', { ascending: true }).limit(2000);
  if (error) console.warn(error);
  const n = { hrv: 0, rhr: 0, sleep: 0, weight: 0, kept: 0 };
  for (const r of days || []) {
    const x = r.data, m = S.metrics[r.day] = S.metrics[r.day] || {};
    const can = prov => !prov || prov === 'garmin' || prov === 'demo';
    if (x.hrv > 0) { if (can(m.hrvProv)) { Object.assign(m, { hrv: x.hrv, hrvMethod: 'rmssd', hrvProv: 'garmin' }); n.hrv++; } else n.kept++; }
    if (x.rhr > 0) { if (can(m.rhrProv)) { Object.assign(m, { rhr: x.rhr, rhrProv: 'garmin' }); n.rhr++; } else n.kept++; }
    if (x.sleepMin > 0) { if (can(m.sleepProv)) { Object.assign(m, { sleepMin: x.sleepMin, inBedMin: x.inBedMin, deepMin: x.deepMin, remMin: x.remMin, lightMin: x.lightMin, sleepProv: 'garmin' });
      if (x.sleepScore != null) m.sleepScoreGarmin = x.sleepScore; if (x.sleepStart != null) m.sleepStart = x.sleepStart; n.sleep++; } else n.kept++; }
    for (const k of ['steps', 'stress', 'bodyBattery', 'kcal']) if (x[k] != null) m[k] = x[k];
    if (x.weight > 0) { if (can(m.weightProv) || m.weight == null) { m.weight = x.weight; m.weightProv = 'garmin'; n.weight++; } else n.kept++; }
    S.garmin.daysCursor = r.updated_at;
  }
  // 2. activités déposées par la synchro : TRIMP, doublons, rapprochement avec le programme
  const pending = S.activities.filter(a => a.pending);
  const rep = { ok: 0, dup: 0, auto: 0, pend: 0, err: [] };
  if (pending.length) {
    await Cloud.samples(pending);
    for (const a of pending) {
      delete a.pending;
      S.activities = S.activities.filter(x => x !== a);
      ingest(a, rep);
      if (!S.activities.includes(a)) Cloud.deleted.add(a.id);   // doublon d'un import manuel : retiré
    }
  }
  // 3. comptes rendus
  const { data: runs } = await sb.from('sync_runs').select('*').order('id', { ascending: false }).limit(8);
  GM.runs = runs || [];
  const P = S.profile, filled = [];
  for (const run of GM.runs.filter(r => (r.status === 'done' || r.status === 'error') && !r.merged).reverse()) {
    for (const [k, v] of Object.entries(run.report?.profile || {})) {
      if (k === 'vo2maxGarmin') { P.vo2maxGarmin = v; continue; }
      if (k !== 'sex' && P[k] == null && v != null) { P[k] = v; filled.push(k); }
    }
    await sb.from('sync_runs').update({ merged: true }).eq('id', run.id);
    run.merged = true;
  }
  if (filled.some(k => k === 'restingHR' || k === 'maxHR')) await recomputeTrimp();
  const changed = (days || []).length || pending.length || filled.length;
  if (changed) {
    S.garmin.lastMerge = { at: Date.now(), days: (days || []).length, hrv: n.hrv, sleep: n.sleep, rhr: n.rhr, kept: n.kept, acts: rep.ok, dup: rep.dup, auto: rep.auto, pend: rep.pend, profile: filled };
    save();
    const bits = [rep.ok && plural(rep.ok, 'activité'), n.sleep && plural(n.sleep, 'nuit'), n.hrv && plural(n.hrv, 'mesure de VFC', 'mesures de VFC')].filter(Boolean);
    if (bits.length) toast('Garmin : ' + bits.join(', ') + (bits.length > 1 || rep.ok > 1 || n.sleep > 1 ? ' ajoutées' : ' ajoutée'));
  }
  const active = GM.runs.some(r => r.status === 'requested' || r.status === 'running');
  clearTimeout(GM.poll);
  if (active) GM.poll = setTimeout(() => garminMerge().then(render), 15000);
}

const RUN_LABEL = { requested: 'En attente', running: 'En cours', done: 'Terminée', error: 'Échec' };
const RUN_COLOR = { requested: 'var(--dim)', running: 'var(--accent)', done: 'var(--good)', error: 'var(--low)' };
const plural = (n, one, many) => `${n} ${n > 1 ? (many || one + 's') : one}`;

function garminCard() {
  const head = sec('Garmin Connect', 'API personnelle officielle');
  if (typeof Cloud === 'undefined' || Cloud.mode !== 'cloud')
    return head + `<div class="card"><div class="metricName">Pas disponible en mode local</div>
      <div class="meta">La synchronisation automatique passe par ton compte et GitHub Actions. Ici, tu peux importer des fichiers FIT à la main.</div></div>`;

  const runs = GM.runs || [], active = runs.find(r => r.status === 'requested' || r.status === 'running');
  const lastDone = runs.find(r => r.status === 'done'), lastErr = runs.find(r => r.status === 'error');
  const failed = lastErr && (!lastDone || lastErr.id > lastDone.id);
  const lm = S.garmin?.lastMerge;
  const when = lm ? relTime(lm.at) : lastDone?.finished_at ? relTime(Date.parse(lastDone.finished_at)) : null;
  const nAct = S.activities.filter(a => a.source === 'garmin').length;
  const nNights = Object.values(S.metrics).filter(m => m.sleepProv === 'garmin').length;
  const nHrv = Object.values(S.metrics).filter(m => m.hrvProv === 'garmin').length;

  let state;
  if (active) state = { ic: 'sync', col: 'var(--accent)', title: 'Mise à jour en cours', sub: ghToken() ? 'GitHub a été prévenu, compte quelques minutes.' : 'Elle part au prochain passage automatique, dans 30 minutes au plus.' };
  else if (failed) state = { ic: 'alert', col: 'var(--low)', title: 'La dernière mise à jour a échoué', sub: lastErr.error || 'Raison inconnue.' };
  else if (when) state = { ic: 'check', col: 'var(--good)', title: 'À jour', sub: `Dernière mise à jour ${when}.` };
  else state = { ic: 'alert', col: 'var(--mid)', title: 'Pas encore connecté', sub: 'Ajoute ta clé Garmin dans les secrets du dépôt GitHub, puis lance une première mise à jour.' };

  return head + `<div class="card">
    <div class="row top"><span style="color:${state.col};flex:none;display:flex">${ic(state.ic, 22)}</span>
      <div class="grow"><div class="metricName">${esc(state.title)}</div><div class="meta">${esc(state.sub)}</div></div></div>

    ${nAct + nNights ? `<div class="row" style="margin-top:14px;gap:0">
      ${[[nAct, 'activité'], [nNights, 'nuit'], [nHrv, 'mesure de VFC', 'mesures de VFC']].map(([n, one, many]) =>
        `<div style="flex:1"><div class="num" style="font-size:21px">${n}</div><div class="meta">${esc((many && n > 1 ? many : one + (n > 1 ? 's' : '')))}</div></div>`).join('')}
    </div>` : ''}

    ${active ? '' : `<div class="row" style="margin-top:16px;gap:10px">
      <button class="btn pri grow" data-a="gmSync">${ic('sync', 17)} Mettre à jour</button>
      <select id="gmDays" style="width:auto;flex:none">${[[3, '3 j'], [7, '7 j'], [30, '30 j'], [90, '90 j'], [180, '6 mois'], [365, '1 an']].map(([d, l]) => `<option value="${d}" ${d === GM.days ? 'selected' : ''}>${l}</option>`).join('')}</select>
    </div>`}
    ${GM.err ? `<div class="small danger" style="margin-top:8px">${esc(GM.err)}</div>` : ''}

    <details><summary>Ce que Garmin remplit, et l'historique</summary>
      <div class="meta" style="margin:6px 0 10px">Variabilité cardiaque nocturne, sommeil et ses phases, fréquence au repos, poids, et chaque activité avec son fichier d'origine. Une valeur que tu saisis toi-même n'est jamais remplacée. La mise à jour part toute seule toutes les 3 heures.</div>
      ${runs.length ? runs.slice(0, 6).map(r => `<div class="kv tiny"><span><span class="dot" style="background:${RUN_COLOR[r.status]}"></span>
        ${new Date(r.finished_at || r.started_at || r.requested_at).toLocaleString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</span>
        <b>${RUN_LABEL[r.status]}${r.report?.counts ? ` — ${Object.entries(r.report.counts).filter(([, v]) => v).map(([k, v]) => `${v} ${k.toLowerCase()}`).join(', ')}` : ''}${r.error ? ' — ' + esc(r.error.slice(0, 120)) : ''}</b></div>`).join('')
        : '<div class="meta">Aucune mise à jour pour l\'instant.</div>'}
    </details>
    <details><summary>Lancer tout de suite plutôt qu'attendre</summary>
      <div class="meta" style="margin:6px 0 10px">Sans réglage, une demande part au prochain passage automatique, dans 30 minutes au plus. Pour qu'elle parte immédiatement, colle un jeton GitHub « fine-grained » limité au dépôt ${esc(CFG.githubRepo || 'garmin')}, avec la seule permission « Actions : Read and write ». Il reste sur cet appareil.</div>
      <div class="row" style="gap:8px"><input type="password" id="ghTok" placeholder="github_pat_…" value="${ghToken() ? '••••••••' : ''}"><button class="btn sm" data-a="ghTokSave">Enregistrer</button></div>
    </details></div>`;
}
async function garminRequest() {
  GM.err = null;
  const to = D.realToday(), from = D.add(to, -(GM.days - 1));
  const { error } = await Cloud.sb.from('sync_runs').insert({ source: 'app', status: 'requested', range_from: from, range_to: to });
  if (error) { GM.err = 'Demande impossible : ' + error.message; render(); return; }
  const tok = ghToken();
  if (tok && CFG.githubRepo) {
    try {
      const r = await fetch(`https://api.github.com/repos/${CFG.githubRepo}/actions/workflows/${CFG.workflow}/dispatches`, { method: 'POST', headers: { Authorization: 'Bearer ' + tok, Accept: 'application/vnd.github+json' }, body: JSON.stringify({ ref: 'main' }) });
      if (!r.ok) GM.err = `GitHub refuse le lancement immédiat (${r.status}) : la demande sera traitée au prochain passage automatique.`;
    } catch (e) { GM.err = 'GitHub injoignable : la demande sera traitée au prochain passage automatique.'; }
  }
  toast('Synchronisation Garmin demandée');
  await garminMerge(); render();
}

Object.assign(A, {
  gmSync() { GM.days = +(document.getElementById('gmDays')?.value || 30); garminRequest(); },
  ghTokSave() { const v = document.getElementById('ghTok')?.value.trim(); if (v && !v.startsWith('••')) { try { localStorage.setItem('cockpit-gh-token', v); } catch (e) { } toast('Jeton enregistré sur cet appareil'); } else if (!v) { try { localStorage.removeItem('cockpit-gh-token'); } catch (e) { } toast('Jeton retiré'); } render(); },
  logout() { if (confirm('Se déconnecter ?')) Cloud.signOut(false); },
  logoutWipe() { if (confirm('Se déconnecter et effacer la copie locale de cet appareil ? (Les données restent dans ton compte.)')) Cloud.signOut(true); }
});

// ===================== Démarrage =====================
(async () => {
  let cloud = false;
  try { cloud = await Cloud.start(); } catch (e) { console.warn(e); }
  if (!cloud) {
    try { const raw = localStorage.getItem(STORE_KEY) || localStorage.getItem('cockpit-apercu-v1'); if (raw) S = Object.assign(fresh(), JSON.parse(raw)); } catch (e) { }
    render();
  }
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
})();

</script>
